apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-dev

configMapGenerator:
- behavior: replace
  envs:
  - dev-public.env
  name: fire-monitoring-config

resources:
- ../../base
- collaboration-rbac.yaml

replicas:
- count: 1
  name: prometheus
- count: 1
  name: loki

images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem/api
  newTag: a32b54b
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem/dashboard
  newTag: a32b54b
- name: db-migrations
  newName: ghcr.io/fauxx/firemonitoringsystem/db-migrations
  newTag: a32b54b
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem/etl-processor
  newTag: a32b54b

labels:
- includeSelectors: true
  pairs:
    deployment-type: development
    environment: dev

patches:
- path: ingress-patch.yaml
