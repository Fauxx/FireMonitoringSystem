apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
  labels:
    app: flyway
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation, HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: flyway
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: db-migrations
          envFrom:
            - configMapRef:
                name: fire-monitoring-config
            - secretRef:
                name: fire-monitoring-secrets
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://db:5432/$(POSTGRES_DB)"
            - name: FLYWAY_USER
              value: "$(POSTGRES_USER)"
            - name: FLYWAY_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
          args: ["-connectRetries=60", "migrate"]

