map $http_x_forwarded_proto $pass_x_forwarded_proto {
    default          $http_x_forwarded_proto;
    ''               $scheme;
}

# Map backend user roles to Grafana organization roles
map $user_role $grafana_role {
    default          Viewer;
    "admin"          Admin;
}

server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index login.html index.html;
    
    # Logging
    access_log /var/log/nginx/dashboard-access.log;
    error_log /var/log/nginx/dashboard-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Performance: Client timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    
    # Max upload size
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1024;
    gzip_disable "msie6";
    
    # Primary routing
    location / {
        try_files $uri $uri/ /login.html;
    }

    # Global redirect for unauthorized requests (auth_request 401)
    error_page 401 = @error401;
    location @error401 {
        return 302 /login.html?message=unauthorized;
    }

    # Protected pages - Protect using auth_request pointing to internal verify location
    location /protected/ {
        auth_request /internal-auth-verify;
        try_files $uri $uri/ =404;
    }
    
    # Internal location for auth verification (prevents body-related timeouts)
    location = /internal-auth-verify {
        internal;
        proxy_pass http://api:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        
        # Propagate headers from original request if needed
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
    }
    
    # Safety net for Grafana's relative path failures
    location /public/build {
        return 301 /grafana$request_uri;
    }
    
    # API proxy (routes /api requests to backend API service)
    location ^~ /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Auth proxy (for login/signup)
    location ^~ /auth {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
    }

    # Messages proxy
    location ^~ /messages {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
    }
    
    # Grafana proxy (proxies directly to Grafana with Nginx auth_request)
    location ^~ /grafana {
        auth_request /internal-auth-verify;
        
        # Extract X-WEBAUTH-USER and User-Role from the auth_request subrequest response
        auth_request_set $webauth_user $upstream_http_x_webauth_user;
        auth_request_set $user_role $upstream_http_x_user_role;
        
        proxy_pass http://grafana:3000;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
        
        # Inject the authenticated username into the proxy request to Grafana
        proxy_set_header X-WEBAUTH-USER $webauth_user;
        
        # Inject the user's mapped role into the proxy request to enforce Viewer/Admin permissions
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        
        # Crucial for iFrames and websockets to load assets smoothly
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Override security headers for Grafana to allow iframe embedding
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Static assets - cache them
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Health check endpoint
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
