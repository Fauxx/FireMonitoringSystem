# ==============================================================================
# BACKEND — 00-Bootstrap State Configuration
# ==============================================================================
#
# PRE-REQUISITE: This storage account MUST be created manually ONCE before
# running `terraform init`. Run these az CLI commands:
#
#   az group create \
#     --name "rg-firemonitoring-tfstate-01" \
#     --location "southeastasia"
#
#   az storage account create \
#     --name "stfiremonitortfstate" \
#     --resource-group "rg-firemonitoring-tfstate-01" \
#     --sku Standard_LRS \
#     --min-tls-version TLS1_2 \
#     --allow-blob-public-access false
#
#   az storage container create \
#     --name "tfstate" \
#     --account-name "stfiremonitortfstate"
#
# After bootstrap runs, all subsequent `terraform init` commands for this
# layer authenticate via OIDC (use_azuread_auth = true) — no storage key needed.
# ==============================================================================

resource_group_name  = "rg-firemonitoring-tfstate-01"
storage_account_name = "stfiremonitortfstate"
container_name       = "tfstate"
key                  = "aks-dev/00-bootstrap/terraform.tfstate"
use_azuread_auth     = true
