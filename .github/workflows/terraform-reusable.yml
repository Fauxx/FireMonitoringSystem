name: "Terraform Core Engine"

on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
        description: "The execution path of the target Terraform layer"
      env:
        required: true
        type: string
        description: "dev | prod"
      mode:
        required: true
        type: string
        description: "validate | deploy"

jobs:
  # -------------------------------------------------------------
  # Job 1: Build the Structural Blueprint and Save It
  # -------------------------------------------------------------
  plan_speculative:
    name: "Build and Store Structural Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Initialize Terraform Runtime
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~> 1.5.0
          terraform_wrapper: false

      # --- REPLACED RAW RECONFIGURE WITH THE CONTRACT ACTION ---
      - name: Execute Contract (Init & Validate Environment)
        uses: ./.github/actions/terraform-contract
        with:
          working_directory: ${{ inputs.directory }}
          environment_name: ${{ inputs.env }}
          use_backend: "true"
          require_secrets: "true"
          do_token: ${{ secrets.TF_VAR_do_token }}
          github_owner: ${{ github.repository_owner }}
          github_repo: ${{ github.event.repository.name }}
          github_app_id: ${{ secrets.APP_ID }}
          github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          # Pass Space/S3 Backend credentials dynamically
          backend_bucket: "fire-monitoring-tfstate" # Update to match your actual bucket naming convention
          backend_region: "us-east-1"
          backend_key: "dev/${{ inputs.directory }}/terraform.tfstate"
          backend_endpoint: "sgp1.digitaloceanspaces.com" # Deduced from your context string "do-sgp1"
          backend_access_key:  ${{ secrets.TF_STATE_ACCESS_KEY }}
          backend_secret_key:  ${{ secrets.TF_STATE_SECRET_KEY }}

      - name: Enforce Formatting & Lint Standards
        if: ${{ inputs.mode == 'validate' }}
        run: |
          cd ${{ inputs.directory }}
          terraform fmt -check -recursive || echo "Formatting warnings found"
          terraform validate

      - name: Compile Speculative Plan Blueprint
        if: ${{ inputs.mode == 'validate' }}
        run: |
          cd ${{ inputs.directory }}
          terraform plan -no-color

      - name: Generate Target Immutable Binary Plan
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          cd ${{ inputs.directory }}
          terraform plan -out=tfplan.binary

      - name: Archive Cryptographic Plan Artifact
        if: ${{ inputs.mode == 'deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.run_id }}
          path: ${{ inputs.directory }}/tfplan.binary
          retention-days: 1

  # -------------------------------------------------------------
  # Job 2: Wait for Approval, then Apply the Plan Exactly
  # -------------------------------------------------------------
  apply_infrastructure:
    name: "Enforce Structural Apply"
    needs: plan_speculative
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    concurrency: tf-${{ inputs.env }}-${{ inputs.directory }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Archived Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.run_id }}
          path: ${{ inputs.directory }}

      - name: Generate fresh In-Memory App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Initialize Terraform Runtime
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~> 1.5.0
          terraform_wrapper: false

      # --- REPLACED RAW RECONFIGURE WITH THE CONTRACT ACTION ---
      - name: Execute Contract (Init & Validate Environment)
        uses: ./.github/actions/terraform-contract
        with:
          working_directory: ${{ inputs.directory }}
          environment_name: ${{ inputs.env }}
          use_backend: "true"
          require_secrets: "true"
          do_token: ${{ secrets.TF_VAR_do_token }}
          github_owner: ${{ github.repository_owner }}
          github_repo: ${{ github.event.repository.name }}
          github_app_id: ${{ secrets.APP_ID }}
          github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          backend_bucket: "fire-monitoring-tfstate"
          backend_region: "us-east-1"
          backend_key: "dev/${{ inputs.directory }}/terraform.tfstate"
          backend_endpoint: "sgp1.digitaloceanspaces.com"
          backend_access_key:  ${{ secrets.TF_STATE_ACCESS_KEY }}
          backend_secret_key:  ${{ secrets.TF_STATE_SECRET_KEY }}

      - name: Execute Immutable Structural Apply
        run: |
          cd ${{ inputs.directory }}
          terraform apply -auto-approve tfplan.binary