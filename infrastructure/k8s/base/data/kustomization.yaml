apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - influx/statefulset.yaml
  - influx/service.yaml
  - mqtt/deployment.yaml
  - mqtt/service.yaml
  - mqtt/exporter.yaml
  - telegraf/deployment.yaml

configMapGenerator:
  - name: mqtt-config
    files:
      - mosquitto.conf=mqtt/config/mosquitto.conf
  - name: telegraf-config
    files:
      - telegraf.conf=telegraf/telegraf.conf
