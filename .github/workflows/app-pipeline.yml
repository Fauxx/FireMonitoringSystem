name: "Application Continuous Integration & Deployment"

on:
  workflow_dispatch: # 1. FIX: Added manual trigger button
  pull_request:
    paths:
      - 'apps/**'
      - 'infrastructure/k8s/base/sql/**'
      - '.github/workflows/app-pipeline.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'infrastructure/k8s/base/sql/**'
      - '.github/workflows/app-pipeline.yml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # Stage 0: Change Detection
  # -------------------------------------------------------------
  detect_changes:
    name: "Detect Changed Services"
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set_services.outputs.services }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            dashboard:
              - 'apps/dashboard/**'
            etl-processor:
              - 'apps/etl-processor/**'
            db-migrations:
              - 'infrastructure/k8s/base/sql/**'

      - name: Determine Services to Build
        id: set_services
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$CHANGES" ] || [ "$CHANGES" = "[]" ]; then
            echo "services=[\"api\", \"dashboard\", \"etl-processor\", \"db-migrations\"]" >> $GITHUB_OUTPUT
          else
            echo "services=$CHANGES" >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------------
  # Stage 1: Code Verification & Container Compilation
  # -------------------------------------------------------------
  build_and_test:
    name: "Compile & Verify ${{ matrix.service }}"
    needs: detect_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
      
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag (Git SHA)
        id: set_tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Container
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'db-migrations' && './infrastructure/k8s/base/sql' || format('./apps/{0}', matrix.service) }}
          # Allow push on manual workflow_dispatch as well
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }} 
          tags: |
            ${{ env.REGISTRY }}/fauxx/firemonitoringsystem/${{ matrix.service }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.REGISTRY }}/fauxx/firemonitoringsystem/${{ matrix.service }}:latest

  # -------------------------------------------------------------
  # Stage 2: Manifest GitOps Trigger
  # -------------------------------------------------------------
  deploy_via_gitops:
    name: "Update GitOps Manifest State"
    needs: [detect_changes, build_and_test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    # 3. FIX: Link this job to your dev environment so it can read APP_ID
    environment: dev 
    
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump Kustomize Image Tags
        run: |
          cd infrastructure/k8s/overlays/dev 
          SERVICES_JSON='${{ needs.detect_changes.outputs.services }}'
          for service in $(echo "$SERVICES_JSON" | jq -r '.[]'); do
            echo "Bumping image tag for service: $service"
            kustomize edit set image "${service}=${{ env.REGISTRY }}/fauxx/firemonitoringsystem/${service}:${{ needs.build_and_test.outputs.image_tag }}"
          done

      - name: Create Pull Request for GitOps bump
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "chore(gitops): bump application images to ${{ needs.build_and_test.outputs.image_tag }}"
          title: "chore(gitops): bump application images to ${{ needs.build_and_test.outputs.image_tag }}"
          body: |
            Bumps Kubernetes manifest image tags for dev environment to ${{ needs.build_and_test.outputs.image_tag }} for the following services:
            ${{ needs.detect_changes.outputs.services }}
          branch: "gitops-image-bump-${{ needs.build_and_test.outputs.image_tag }}"
          base: main
          delete-branch: true

  promote_to_prod:
    name: "Promote to Production (GitOps)"
    needs: [detect_changes, build_and_test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump Production Kustomize Image Tags
        run: |
          cd infrastructure/k8s/overlays/prod
          SERVICES_JSON='${{ needs.detect_changes.outputs.services }}'
          for service in $(echo "$SERVICES_JSON" | jq -r '.[]'); do
            echo "Bumping image tag for service: $service"
            kustomize edit set image "${service}=${{ env.REGISTRY }}/fauxx/firemonitoringsystem/${service}:${{ needs.build_and_test.outputs.image_tag }}"
          done

      - name: Create Pull Request for Production GitOps bump
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "chore(gitops): promote application images to prod:${{ needs.build_and_test.outputs.image_tag }}"
          title: "chore(gitops): promote application images to prod:${{ needs.build_and_test.outputs.image_tag }}"
          body: |
            Promotes Kubernetes manifest image tags for production environment to ${{ needs.build_and_test.outputs.image_tag }} for the following services:
            ${{ needs.detect_changes.outputs.services }}
          branch: "gitops-prod-image-bump-${{ needs.build_and_test.outputs.image_tag }}"
          base: main
          delete-branch: true