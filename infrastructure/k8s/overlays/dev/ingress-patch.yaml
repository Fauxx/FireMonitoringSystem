apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fire-monitoring
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # Development annotations - no rate limiting needed
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # WebSocket Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Cloudflare handles TLS termination at the edge - disable nginx SSL redirect
    # to prevent self-signed cert errors (MOZILLA_PKIX_ERROR_SELF_SIGNED_CERT / HSTS)
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # Trust Cloudflare's X-Forwarded-Proto header so apps know the request came in as HTTPS
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
    - host: dev.fires.systems
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /messages
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          # --- NEW ROUTE ---
          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: mqtt
                port:
                  number: 9001
