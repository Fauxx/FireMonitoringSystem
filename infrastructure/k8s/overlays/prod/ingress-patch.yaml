apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fire-monitoring
  annotations:
    # Security and rate limiting for production
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # WebSocket Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - your-domain.com
        - www.your-domain.com
      secretName: fire-monitoring-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /messages
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: mqtt
                port:
                  number: 9001
    - host: www.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /messages
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: mqtt
                port:
                  number: 9001
