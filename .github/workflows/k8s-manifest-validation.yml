name: "Kubernetes Manifest Validation"

env:
  KUBERNETES_VERSION: "1.30.0"

on:
  push:
    branches: [ main, dev-zet ]
    paths:
      - 'infrastructure/k8s/**'
      - '.github/workflows/k8s-manifest-validation.yml'
  pull_request:
    paths:
      - 'infrastructure/k8s/**'
      - '.github/workflows/k8s-manifest-validation.yml'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Step 1: Detect which overlays were touched
  # ─────────────────────────────────────────────────────────────
  detect_overlays:
    name: "Detect Changed Overlays"
    runs-on: ubuntu-latest
    outputs:
      overlays: ${{ steps.set_overlays.outputs.overlays }}
      any_changed: ${{ steps.set_overlays.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'infrastructure/k8s/base/**'
            dev:
              - 'infrastructure/k8s/overlays/dev/**'
            prod:
              - 'infrastructure/k8s/overlays/prod/**'

      - name: Build Changed Overlay Matrix
        id: set_overlays
        run: |
          OVERLAYS='[]'
          # base changes affect ALL overlays → validate both dev + prod
          if [ "${{ steps.filter.outputs.base }}" = "true" ]; then
            OVERLAYS=$(echo '[]' | jq -c '. + ["dev", "prod"]')
          else
            if [ "${{ steps.filter.outputs.dev }}" = "true" ]; then
              OVERLAYS=$(echo "$OVERLAYS" | jq -c '. + ["dev"]')
            fi
            if [ "${{ steps.filter.outputs.prod }}" = "true" ]; then
              OVERLAYS=$(echo "$OVERLAYS" | jq -c '. + ["prod"]')
            fi
          fi
          if [ "$OVERLAYS" = "[]" ] || [ -z "$OVERLAYS" ]; then
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "overlays=[]"       >> $GITHUB_OUTPUT
          else
            echo "any_changed=true"  >> $GITHUB_OUTPUT
            echo "overlays=$OVERLAYS" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  # Step 2: Validate only the overlays that changed
  # ─────────────────────────────────────────────────────────────
  validate:
    name: "Validate ${{ matrix.overlay }} Overlay"
    needs: detect_overlays
    if: needs.detect_overlays.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: ${{ fromJSON(needs.detect_overlays.outputs.overlays) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        run: |
          KC_TOOL="kube""conform"
          curl -sSLo kc.tar.gz \
            https://github.com/yannh/${KC_TOOL}/releases/latest/download/${KC_TOOL}-linux-amd64.tar.gz
          tar -xf kc.tar.gz
          sudo mv ${KC_TOOL} /usr/local/bin/${KC_TOOL}

      - name: Prepare secrets stub (dev only)
        if: matrix.overlay == 'dev'
        run: |
          [ ! -f infrastructure/k8s/overlays/dev/secrets.yaml ] && \
            cp infrastructure/k8s/overlays/dev/secrets.yaml.example \
               infrastructure/k8s/overlays/dev/secrets.yaml || true

      - name: Build & kubeconform Validate (${{ matrix.overlay }})
        run: |
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} \
            | kubeconform \
                -strict \
                -kubernetes-version ${{ env.KUBERNETES_VERSION }} \
                -ignore-missing-schemas \
                -summary \
                -output tap

      - name: Validate Local Overlay (smoke test)
        if: matrix.overlay == 'dev'
        run: kustomize build infrastructure/k8s/overlays/local > /dev/null

      # ─────────────────────────────────────────────────────────────
      # Phase 4 Architectural Decision:
      # Static kubeconform + kustomize build provides fast linting (<20s).
      # Full Kubernetes runtime validation (Kind cluster spin-up, pod rollout,
      # and health checks) is centrally handled by `k8s_smoke_test` in
      # .github/workflows/app-pipeline.yml to avoid matrix latency multipliers.
      # ─────────────────────────────────────────────────────────────
