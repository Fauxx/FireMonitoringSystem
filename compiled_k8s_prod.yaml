    log_dest file /mosquitto/log/mosquitto.log

    # Standard MQTT Port
    listener 1883
    allow_anonymous true  # Change to false later for security

    # --- NEW: WebSockets Configuration (External Ingress Traffic) ---
    listener 9001
    protocol websockets
    allow_anonymous true
