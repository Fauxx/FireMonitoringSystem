name: "GCP Terraform Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [gke-dev, gke-prod]
        required: true
      execution_mode:
        description: "Plan only or apply"
        type: choice
        options: [plan-only, apply]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  # A lightweight native job that anchors the workflow graph.
  # This prevents GitHub from hitting startup_failure when all jobs are uses:.
  setup:
    name: "Setup"
    runs-on: ubuntu-latest
    outputs:
      environment:    ${{ inputs.environment }}
      execution_mode: ${{ inputs.execution_mode }}
    steps:
      - name: Echo parameters
        run: |
          echo "Environment:    ${{ inputs.environment }}"
          echo "Execution mode: ${{ inputs.execution_mode }}"

  infra:
    name: "01-infra"
    needs: setup
    uses: ./.github/workflows/gcp-terraform-reusable.yml
    with:
      environment:    ${{ inputs.environment }}
      layer_dir:      infrastructure/terraform/environments/${{ inputs.environment }}/00-bootstrap
      execution_mode: ${{ inputs.execution_mode }}
    secrets: inherit

  platform:
    name: "02-platform"
    needs: infra
    uses: ./.github/workflows/gcp-terraform-reusable.yml
    with:
      environment:    ${{ inputs.environment }}
      layer_dir:      infrastructure/terraform/environments/${{ inputs.environment }}/02-platform
      execution_mode: ${{ inputs.execution_mode }}
    secrets: inherit

  argocd:
    name: "03-argocd"
    needs: platform
    uses: ./.github/workflows/gcp-terraform-reusable.yml
    with:
      environment:    ${{ inputs.environment }}
      layer_dir:      infrastructure/terraform/environments/${{ inputs.environment }}/03-argocd
      execution_mode: ${{ inputs.execution_mode }}
    secrets: inherit
