## Common S3-compatible backend settings for DigitalOcean Spaces
## This file is intended to be a non-sensitive shared backend config. Do NOT
## include access_key/secret_key here; provide those via env vars or CI secrets.

bucket = "tup-firemonitoring-state"
region = "us-east-1"

endpoints = {
  s3 = "https://sgp1.digitaloceanspaces.com"
}

## Avoid broad "skip_*" validations unless an environment requires them.
# For S3-compatible backends (DigitalOcean Spaces) Terraform will attempt
# to call STS/GetCallerIdentity which Spaces does not support. Enable the
# following skip flags when using a non-AWS S3-compatible endpoint to
# prevent Terraform from attempting AWS STS calls during `terraform init`.
# These are safe for non-AWS S3 backends but should remain disabled for
# real AWS S3 buckets.
skip_credentials_validation = true
skip_metadata_api_check     = true
skip_region_validation      = true
skip_requesting_account_id  = true

use_path_style = true
