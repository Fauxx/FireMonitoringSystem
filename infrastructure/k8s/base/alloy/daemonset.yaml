apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.7.2
          args: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods

