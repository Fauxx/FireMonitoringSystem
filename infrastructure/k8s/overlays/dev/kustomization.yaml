apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-dev

configMapGenerator:
- behavior: replace
  envs:
  - dev-public.env
  name: fire-monitoring-config

resources:
- ../../base
- secrets.yaml

replicas:
- count: 1
  name: prometheus
- count: 1
  name: loki

images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem/api
  newTag: bba3e9c
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem/dashboard
  newTag: bba3e9c
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem/etl-processor
  newTag: bba3e9c

labels:
- includeSelectors: true
  pairs:
    deployment-type: development
    environment: dev

patches:
- path: ingress-patch.yaml
