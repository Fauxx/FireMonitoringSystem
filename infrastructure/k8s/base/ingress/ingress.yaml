apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fire-monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /messages
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          # --- NEW ROUTE ---
          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: mqtt
                port:
                  number: 9001

