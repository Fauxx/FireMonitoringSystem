# ==============================================================================
# Azure Backend Shared Defaults (CAF-Compliant)
# ==============================================================================
# Shared across all backend.conf files in aks-dev/* and aks-prod/*.
# Each layer's backend.conf overrides only the `key` value.
#
# Authentication: Entra ID (OIDC) — no storage account key required.
# The GitHub Actions identity has Storage Blob Data Contributor on this account.
# ==============================================================================
resource_group_name  = "rg-firemonitoring-tfstate-01"
storage_account_name = "stfiremonitortfstate"
container_name       = "tfstate"
use_azuread_auth     = true
