name: "Infrastructure Pipeline Orchestrator (Prod)"

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Terraform layer to deploy to Production"
        required: true
        type: choice
        options:
          - 01-infra
          - 02-platform
          - 03-argocd
          - all
        default: all
      execution_mode:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - plan-only
          - apply
        default: plan-only

concurrency:
  group: terraform-deploy-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  deploy_prod:
    strategy:
      fail-fast: true
      matrix:
        layer: ["01-infra", "02-platform", "03-argocd"]
    # Drops unselected layers dynamically if you choose a specific one via UI
    if: ${{ inputs.layer == 'all' || inputs.layer == matrix.layer }}
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/prod/${{ matrix.layer }}"
      env: "prod" # Triggers the manual environment approval gate automatically!
      mode: ${{ inputs.execution_mode == 'apply' && 'deploy' || 'validate' }}
    secrets: inherit