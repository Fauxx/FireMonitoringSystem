apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-prod

configMapGenerator:
- envs:
  - prod-public.env
  name: fire-monitoring-config

resources:
- ../../base
- grafana-ops-ingress.yaml
- collaboration-rbac.yaml

patchesStrategicMerge:
- cloudflared-patch.yaml
- ingress-patch.yaml
- api-replicas-patch.yaml
- dashboard-replicas-patch.yaml

images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem/api
  newTag: 48bccba
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem/dashboard
  newTag: 48bccba
- name: db-migrations
  newName: ghcr.io/fauxx/firemonitoringsystem/db-migrations
  newTag: a4eb2ae
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem/etl-processor
  newTag: 48bccba
- name: mcu-simulator
  newName: ghcr.io/fauxx/firemonitoringsystem/mcu-simulator
  newTag: 248de56

commonLabels:
  deployment-type: production
  environment: prod

patches:
- patch: |-
    - op: add
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: standard-rwo
  target:
    kind: StatefulSet
    name: influx
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: grafana-data
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: prometheus-data
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: loki-data
