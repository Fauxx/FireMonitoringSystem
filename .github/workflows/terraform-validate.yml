name: Terraform Validate (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-validate.yml"

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: "validation-placeholder"
      AWS_SECRET_ACCESS_KEY: "validation-placeholder"
      AWS_REGION: "us-east-1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=infrastructure/terraform fmt -recursive -check -diff
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Terraform formatting is clean."
            exit 0
          fi
          if [ "$code" -eq 3 ]; then
            echo "::warning::terraform fmt reported formatting differences (exit 3). This is non-blocking for PR validation."
            exit 0
          fi
          echo "terraform fmt failed with unexpected exit code $code"
          exit "$code"

  terraform-validate:
    needs: terraform-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: "validation-placeholder"
      AWS_SECRET_ACCESS_KEY: "validation-placeholder"
      AWS_REGION: "us-east-1"
      TF_VAR_do_token: "validation-placeholder"
      TF_VAR_root_domain: "example.invalid"
      TF_VAR_cluster_name: "validation-cluster"
      TF_VAR_node_size: "s-2vcpu-2gb"
      TF_VAR_node_count: "1"
      TF_VAR_github_token: "validation-placeholder"
      TF_VAR_remote_state_bucket: "validation-placeholder"
      TF_VAR_infra_state_key: "dev/01-infra/terraform.tfstate"
      TF_VAR_github_repository: "FireMonitoringSystem"
      TF_VAR_argocd_server: "argocd.example.invalid"
      TF_VAR_gitops_repo_url: "https://github.com/example/repo.git"
    strategy:
      fail-fast: false
      matrix:
        layer:
          - dev/01-infra
          - dev/02-platform
          - dev/03-argocd
    defaults:
      run:
        shell: bash
        working-directory: infrastructure/terraform/environments/${{ matrix.layer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5.0"

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -reconfigure

      - name: Terraform Validate
        run: terraform validate -no-color
