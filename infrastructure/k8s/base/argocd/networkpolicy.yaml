apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-network-policy
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow all ingress from within the argocd namespace itself
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd

    # Allow from application namespace (for webhook/pulling)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fire-monitoring-dev
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081

    # Allow from Nginx Ingress Controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081

    # Allow from monitoring namespace if present
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

    # Allow DNS
    - from:
        - podSelector: {}
      ports:
        - protocol: UDP
          port: 53

  egress:
    # Allow all egress within the argocd namespace (Redis/Dex/internal communication)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd

    # Allow egress to the Kubernetes API Server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443

    # Allow to application namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fire-monitoring-dev
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

    # Allow to GitHub/registry (any destination on port 443/80)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

    # Allow DNS (any destination on port 53 UDP/TCP)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow kube-dns explicitly
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-repo-server-network-policy
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from argocd-server and argocd-application-controller
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-application-controller
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8084

  egress:
    # Allow to GitHub and container registries (any destination on port 443/80)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
