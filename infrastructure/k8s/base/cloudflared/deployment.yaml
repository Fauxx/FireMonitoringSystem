apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  # 2 replicas = high availability. If one pod dies, Cloudflare
  # automatically fails over to the other tunnel connection.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Restart policy handled by Deployment controller
      restartPolicy: Always
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.11.0
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config/config.yml
            - run
          env:
            - name: TUNNEL_ORIGIN_CERT
              value: /etc/cloudflared/credentials/credentials.json
          volumeMounts:
            # Mount the ConfigMap (config.yml) — tunnel routing rules
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            # Mount the Secret (credentials.json) — tunnel identity/auth
            - name: credentials
              mountPath: /etc/cloudflared/credentials
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflare-tunnel-credentials
