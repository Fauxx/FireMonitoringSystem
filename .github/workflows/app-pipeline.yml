name: "Application CI/CD — Build, Secure & Deploy"

on:
  workflow_dispatch: # Emergency manual trigger — builds ALL services
  pull_request:
    paths:
      - 'apps/**'
      - 'infrastructure/k8s/base/sql/**'
      - '.github/workflows/app-pipeline.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'infrastructure/k8s/base/sql/**'
      - '.github/workflows/app-pipeline.yml'
    tags:
      - 'v*.*.*'   # Production release-only trigger

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fauxx/firemonitoringsystem

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 0: Path-Based Change Detection
  # ─────────────────────────────────────────────────────────────
  detect_changes:
    name: "Detect Changed Services"
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set_services.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            dashboard:
              - 'apps/dashboard/**'
            etl-processor:
              - 'apps/etl-processor/**'
            db-migrations:
              - 'infrastructure/k8s/base/sql/**'

      - name: Determine Services to Build
        id: set_services
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          # On manual trigger or release tag → build everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || \
             [ -z "$CHANGES" ] || [ "$CHANGES" = "[]" ]; then
            echo 'services=["api", "dashboard", "etl-processor", "db-migrations"]' >> $GITHUB_OUTPUT
          else
            echo "services=$CHANGES" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  # Stage 1: Build → Scan → Push
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # Stage 0.5: Test — Lint & Unit Tests (per changed service)
  # ─────────────────────────────────────────────────────────────
  test:
    name: "Test: ${{ matrix.service }}"
    needs: detect_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      # ── Node.js services (api) ──
      - name: Setup Node.js
        if: matrix.service == 'api'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install & Test (API)
        if: matrix.service == 'api'
        working-directory: apps/api
        run: |
          npm ci
          npm run lint -- --max-warnings=0 || true
          npm test

      # ── Python services (etl-processor) ──
      - name: Setup Python
        if: matrix.service == 'etl-processor'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/etl-processor/requirements.txt

      - name: Install & Test (ETL)
        if: matrix.service == 'etl-processor'
        working-directory: apps/etl-processor
        run: |
          pip install -r requirements.txt
          pytest --tb=short -q

      # ── Static services (dashboard, db-migrations) — no tests yet ──
      - name: Skip (no tests)
        if: matrix.service == 'dashboard' || matrix.service == 'db-migrations'
        run: echo "No tests defined for ${{ matrix.service }} — skipping."

  build_scan_push:
    name: "Build & Scan: ${{ matrix.service }}"
    needs: [detect_changes, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}"  >> $GITHUB_OUTPUT  # e.g. v1.0.0
          else
            echo "tag=${GITHUB_SHA::7}"        >> $GITHUB_OUTPUT  # e.g. 7542de2
          fi

      - name: Resolve Build Context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "db-migrations" ]; then
            echo "path=./infrastructure/k8s/base/sql" >> $GITHUB_OUTPUT
          else
            echo "path=./apps/${{ matrix.service }}"  >> $GITHUB_OUTPUT
          fi

      # ── Step A: Build locally (no push) so Trivy can scan ──
      - name: Build Container Image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: false
          load: true
          tags: scan-target:${{ steps.set_tag.outputs.tag }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Step B: Vulnerability scan ──
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:  scan-target:${{ steps.set_tag.outputs.tag }}
          format:     table
          exit-code:  '1'          # Blocks pipeline on HIGH/CRITICAL vulnerabilities.
          severity:   HIGH,CRITICAL
          trivyignores: .trivyignore

      # ── Step C: Push to registry (main merges and release tags only) ──
      - name: Push Container Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Stage 2a: Dev Deploy — Direct Commit to overlays/dev
  # Triggers: push to main only (NOT on tags, NOT on PR)
  # ─────────────────────────────────────────────────────────────
  deploy_dev:
    name: "Deploy to Dev (GitOps direct commit)"
    needs: [detect_changes, build_scan_push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gke-dev

    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump Dev Overlay Image Tags
        run: |
          cd infrastructure/k8s/overlays/dev
          for service in $(echo '${{ needs.detect_changes.outputs.services }}' | jq -r '.[]'); do
            kustomize edit set image \
              "${service}=${{ env.IMAGE_PREFIX }}/${service}:${{ needs.build_scan_push.outputs.image_tag }}"
          done

      - name: Commit & Push Dev Overlay
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore(gitops/dev): bump images → ${{ needs.build_scan_push.outputs.image_tag }} [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────
  # Stage 2b: Prod Release — Open Promotion PR
  # Triggers: Git Release Tag push ONLY (v*.*.*)
  # ─────────────────────────────────────────────────────────────
  promote_prod:
    name: "Open Production Promotion PR"
    needs: [detect_changes, build_scan_push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: gke-prod

    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump Prod Overlay Image Tags
        run: |
          cd infrastructure/k8s/overlays/prod
          for service in $(echo '${{ needs.detect_changes.outputs.services }}' | jq -r '.[]'); do
            kustomize edit set image \
              "${service}=${{ env.IMAGE_PREFIX }}/${service}:${{ needs.build_scan_push.outputs.image_tag }}"
          done

      - name: Open Prod Promotion PR
        uses: peter-evans/create-pull-request@v6
        with:
          token:          ${{ steps.app_token.outputs.token }}
          commit-message: "chore(gitops/prod): promote release ${{ github.ref_name }}"
          title:          "🚀 Release ${{ github.ref_name }} → Production"
          body: |
            ## Production Promotion — ${{ github.ref_name }}

            This PR was automatically generated when release tag `${{ github.ref_name }}` was published.

            ### Services Updated
            ${{ needs.detect_changes.outputs.services }}

            ### Image Tag
            `${{ needs.build_scan_push.outputs.image_tag }}`

            ---
            **Review checklist before merging:**
            - [ ] Dev environment tested and stable
            - [ ] No critical Trivy findings requiring remediation
            - [ ] Changelog reviewed
          branch:        "release/prod-${{ github.ref_name }}"
          base:          main
          delete-branch: true
          labels:        "production-release,gitops"