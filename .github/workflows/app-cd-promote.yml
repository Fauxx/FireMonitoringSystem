name: App CD Promote to Prod

on:
  workflow_dispatch:

concurrency:
  group: app-cd-promote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup kustomize
        run: |
          set -euo pipefail
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.0/kustomize_v5.4.0_linux_amd64.tar.gz | tar xz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Promote dev image tags to prod
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import os

          def parse_images(path: str) -> dict:
              images = {}
              current = None
              for line in Path(path).read_text().splitlines():
                  name_match = re.match(r"\s*-\s*name:\s*([^\s#]+)", line)
                  if name_match:
                      current = name_match.group(1)
                      images[current] = {}
                      continue
                  if current:
                      new_name_match = re.match(r"\s*newName:\s*([^\s#]+)", line)
                      if new_name_match:
                          images[current]["newName"] = new_name_match.group(1)
                          continue
                      new_tag_match = re.match(r"\s*newTag:\s*([^\s#]+)", line)
                      if new_tag_match:
                          images[current]["newTag"] = new_tag_match.group(1)
                          current = None
              return images

          dev_images = parse_images("infrastructure/k8s/overlays/dev/kustomization.yaml")
          if not dev_images:
              raise SystemExit("No images found in dev kustomization.")

          for name, meta in dev_images.items():
              if "newName" not in meta or "newTag" not in meta:
                  raise SystemExit(f"Missing newName/newTag for {name}")

          os.chdir("infrastructure/k8s/overlays/prod")
          for name, meta in dev_images.items():
              image = f"{meta['newName']}:{meta['newTag']}"
              subprocess.check_call(["kustomize", "edit", "set", "image", f"{name}={image}"])
          PY

      - name: Create prod manifest patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No manifest changes to package."
            exit 0
          fi
          git diff -- infrastructure/k8s/overlays/prod/kustomization.yaml > prod-manifests.patch

      - name: Upload prod manifest patch
        if: hashFiles('prod-manifests.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prod-kustomize-patch-${{ github.run_id }}
          path: prod-manifests.patch
          retention-days: 7
