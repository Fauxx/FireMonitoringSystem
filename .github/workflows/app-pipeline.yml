name: "Application Continuous Integration & Deployment"

on:
  workflow_dispatch: # 1. FIX: Added manual trigger button
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/app-pipeline.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/app-pipeline.yml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # 2. FIX: Hardcoded lowercase 'fauxx' to prevent Docker build crashes
  IMAGE_NAME: fauxx/firemonitoringsystem/api

jobs:
  # -------------------------------------------------------------
  # Stage 1: Code Verification & Container Compilation
  # -------------------------------------------------------------
  build_and_test:
    name: "Compile & Verify Microservices"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
      
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag (Git SHA)
        id: set_tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api 
          # Allow push on manual workflow_dispatch as well
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }} 
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # -------------------------------------------------------------
  # Stage 2: Manifest GitOps Trigger
  # -------------------------------------------------------------
  deploy_via_gitops:
    name: "Update GitOps Manifest State"
    needs: build_and_test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    # 3. FIX: Link this job to your dev environment so it can read APP_ID
    environment: dev 
    
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump Kustomize Image Tags
        run: |
          cd infrastructure/k8s/overlays/dev 
          
          # 4. FIX: Replaced placeholder with the exact string from your k8s deployment.yaml
          kustomize edit set image ghcr.io/fauxx/firemonitoringsystem/api:sha-000000000000=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build_and_test.outputs.image_tag }}

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(gitops): bump application image to ${{ needs.build_and_test.outputs.image_tag }}"
            git push origin main
            echo "GitOps manifest updated successfully."
          else
            echo "No manifest changes detected."
          fi