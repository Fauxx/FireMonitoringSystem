name: "Application Continuous Integration & Deployment"

on:
  workflow_dispatch: # 1. FIX: Added manual trigger button
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/app-pipeline.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/app-pipeline.yml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # Stage 1: Code Verification & Container Compilation
  # -------------------------------------------------------------
  build_and_test:
    name: "Compile & Verify ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [api, dashboard, etl-processor]
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
      
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag (Git SHA)
        id: set_tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          # Allow push on manual workflow_dispatch as well
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }} 
          tags: |
            ${{ env.REGISTRY }}/fauxx/firemonitoringsystem/${{ matrix.service }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.REGISTRY }}/fauxx/firemonitoringsystem/${{ matrix.service }}:latest

  # -------------------------------------------------------------
  # Stage 2: Manifest GitOps Trigger
  # -------------------------------------------------------------
  deploy_via_gitops:
    name: "Update GitOps Manifest State"
    needs: build_and_test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    # 3. FIX: Link this job to your dev environment so it can read APP_ID
    environment: dev 
    
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump Kustomize Image Tags
        run: |
          cd infrastructure/k8s/overlays/dev 
          kustomize edit set image api=${{ env.REGISTRY }}/fauxx/firemonitoringsystem/api:${{ needs.build_and_test.outputs.image_tag }}
          kustomize edit set image dashboard=${{ env.REGISTRY }}/fauxx/firemonitoringsystem/dashboard:${{ needs.build_and_test.outputs.image_tag }}
          kustomize edit set image etl-processor=${{ env.REGISTRY }}/fauxx/firemonitoringsystem/etl-processor:${{ needs.build_and_test.outputs.image_tag }}

      - name: Create Pull Request for GitOps bump
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "chore(gitops): bump application images to ${{ needs.build_and_test.outputs.image_tag }}"
          title: "chore(gitops): bump application images to ${{ needs.build_and_test.outputs.image_tag }}"
          body: |
            Bumps Kubernetes manifest image tags for dev environment to:
            - API: `${{ needs.build_and_test.outputs.image_tag }}`
            - Dashboard: `${{ needs.build_and_test.outputs.image_tag }}`
            - ETL Processor: `${{ needs.build_and_test.outputs.image_tag }}`
          branch: "gitops-image-bump-${{ needs.build_and_test.outputs.image_tag }}"
          base: main
          delete-branch: true