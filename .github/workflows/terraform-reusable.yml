name: "Terraform Core Engine"

on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
        description: "The execution path of the target Terraform layer"
      layer_kind:
        required: true
        type: string
        description: "infra | platform | gitops"
      env:
        required: true
        type: string
        description: "dev | prod"
      mode:
        required: true
        type: string
        description: "validate | deploy"

jobs:
  terraform_pipeline:
    name: "Terraform Pipeline Execution"
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'deploy' && inputs.env || '' }}
    concurrency: tf-${{ inputs.env }}-${{ inputs.directory }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_github_token: ${{ github.token }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_github_app_id: ${{ secrets.APP_ID }}
      TF_VAR_github_app_installation_id: ${{ secrets.APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      TF_VAR_ssh_key_ids: ${{ secrets.SSH_KEY_IDS }}
      TF_VAR_do_ssh_host_fingerprint: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
      TF_VAR_ghcr_deploy_username: ${{ secrets.GHCR_DEPLOY_USERNAME }}
      TF_VAR_ghcr_deploy_token: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}

      # --- Streamlined Infrastructure Truths (Injected via Bootstrap) ---
      TF_VAR_root_domain: ${{ vars.ROOT_DOMAIN }}
      TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
      TF_VAR_node_size: ${{ vars.NODE_SIZE }}
      TF_VAR_node_count: ${{ vars.NODE_COUNT }}
      TF_VAR_remote_state_bucket: ${{ vars.REMOTE_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.INFRA_STATE_KEY }}
      TF_VAR_gitops_repo_url: ${{ vars.GITOPS_REPO_URL }}

    steps:

      - name: Checkout Codebase
        uses: actions/checkout@v4

      # FIX 1: Explicitly force symlink health during runtime before execution contract
      - name: Re-link Global Provider Truths
        run: |
          cd ${{ inputs.directory }}
          rm -f versions.tf
          ln -s ../../../global/versions.tf versions.tf

      - name: Initialize Terraform Runtime
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~> 1.5.0
          terraform_wrapper: false

      - name: Execute Contract (Init & Validate)
        uses: ./.github/actions/terraform-contract
        with:
          working_directory: ${{ inputs.directory }}
          environment_name: ${{ inputs.env }}
          layer_kind: ${{ inputs.layer_kind }}
          use_backend: "true"
          require_secrets: "true"
          do_token: ${{ secrets.DO_TOKEN }}
          github_owner: ${{ github.repository_owner }}
          github_repo: ${{ github.event.repository.name }}
          github_app_id: ${{ secrets.APP_ID }}
          github_app_installation_id: ${{ secrets.APP_INSTALLATION_ID }}
          github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          ssh_key_ids: ${{ secrets.SSH_KEY_IDS }}
          do_ssh_host_fingerprint: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}

      - name: Plan/Format/Validate
        if: ${{ inputs.mode == 'validate' }}
        run: |
          cd ${{ inputs.directory }}
          terraform fmt -check -recursive
          terraform validate
          terraform plan -no-color

      - name: Generate Immutable Plan
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          cd ${{ inputs.directory }}
          terraform plan -no-color -out=tfplan.binary

  apply_infrastructure:
    name: "Apply Structural Plan"
    needs: terraform_pipeline
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
      environments: write
      secrets: write
      actions: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      # FIX 2: Pass ALL necessary provider tokens to the apply environment block as well!
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_github_token: ${{ github.token }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_github_app_id: ${{ secrets.APP_ID }}
      TF_VAR_github_app_installation_id: ${{ secrets.APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      TF_VAR_ssh_key_ids: ${{ secrets.SSH_KEY_IDS }}
      TF_VAR_do_ssh_host_fingerprint: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}

      # --- Streamlined Infrastructure Truths (Injected via Bootstrap) ---
      TF_VAR_root_domain: ${{ vars.ROOT_DOMAIN }}
      TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
      TF_VAR_node_size: ${{ vars.NODE_SIZE }}
      TF_VAR_node_count: ${{ vars.NODE_COUNT }}
      TF_VAR_remote_state_bucket: ${{ vars.REMOTE_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.INFRA_STATE_KEY }}
      TF_VAR_gitops_repo_url: ${{ vars.GITOPS_REPO_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FIX 1: Reinforce the symlink on the secondary runner
      - name: Re-link Global Provider Truths
        run: |
          cd ${{ inputs.directory }}
          rm -f versions.tf
          ln -s ../../../global/versions.tf versions.tf

      - name: Initialize Terraform Runtime
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~> 1.5.0
          terraform_wrapper: false

      # FIX 3: Re-execute the backend hook so this runner can open the state communications
      - name: Execute Contract (Backend Initialization)
        uses: ./.github/actions/terraform-contract
        with:
          working_directory: ${{ inputs.directory }}
          environment_name: ${{ inputs.env }}
          layer_kind: ${{ inputs.layer_kind }}
          use_backend: "true"
          require_secrets: "true"
          do_token: ${{ secrets.DO_TOKEN }}
          github_owner: ${{ github.repository_owner }}
          github_repo: ${{ github.event.repository.name }}
          github_app_id: ${{ secrets.APP_ID }}
          github_app_installation_id: ${{ secrets.APP_INSTALLATION_ID }}
          github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          ssh_key_ids: ${{ secrets.SSH_KEY_IDS }}
          do_ssh_host_fingerprint: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}

      - name: Download Archived Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.run_id }}
          path: ${{ inputs.directory }}

      - name: Execute Immutable Apply
        run: |
          cd ${{ inputs.directory }}
          terraform apply -auto-approve tfplan.binary