apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-dev

configMapGenerator:
- envs:
  - dev-public.env
  name: fire-monitoring-config

resources:
- ../../base
- collaboration-rbac.yaml

replicas:
- count: 1
  name: prometheus
- count: 1
  name: loki

images:
- name: api
  newName: asia-east1-docker.pkg.dev/firemonitoring-dev/firemonitoring-dev/api
  newTag: 81ad4d1
- name: dashboard
  newName: asia-east1-docker.pkg.dev/firemonitoring-dev/firemonitoring-dev/dashboard
  newTag: 81ad4d1
- name: db-migrations
  newName: asia-east1-docker.pkg.dev/firemonitoring-dev/firemonitoring-dev/db-migrations
  newTag: 81ad4d1
- name: etl-processor
  newName: asia-east1-docker.pkg.dev/firemonitoring-dev/firemonitoring-dev/etl-processor
  newTag: 81ad4d1
- name: mcu-simulator
  newName: asia-east1-docker.pkg.dev/firemonitoring-dev/firemonitoring-dev/mcu-simulator
  newTag: 81ad4d1

labels:
- includeSelectors: true
  pairs:
    deployment-type: development
    environment: dev

patches:
- path: ingress-patch.yaml
- path: mqtt-service-patch.yaml
- patch: |-
    - op: add
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: standard-rwo
  target:
    kind: StatefulSet
    name: influx
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: prometheus-data
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: loki-data
- patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
  target:
    kind: Deployment
    name: api
- patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
  target:
    kind: Deployment
    name: dashboard
- patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
  target:
    kind: Deployment
    name: etl-processor
