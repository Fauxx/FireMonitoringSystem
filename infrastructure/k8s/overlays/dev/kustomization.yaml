apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-dev

resources:
- ../../base


images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem/api
  newTag: sha-000000000000
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem/etl-processor
  newTag: sha-000000000000
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem/dashboard
  newTag: sha-000000000000

labels:
- includeSelectors: true
  pairs:
    deployment-type: development
    environment: dev
patches:
- path: ingress-patch.yaml
