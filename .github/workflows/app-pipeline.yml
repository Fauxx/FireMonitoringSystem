name: "Application CI/CD — Build, Secure & Deploy"

on:
  workflow_dispatch: # Emergency manual trigger — builds ALL services
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/app-pipeline.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/app-pipeline.yml'
    tags:
      - 'v*.*.*'   # Production release-only trigger

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fauxx/firemonitoringsystem-v2
  GAR_REGISTRY: asia-east1-docker.pkg.dev
  GAR_PREFIX: asia-east1-docker.pkg.dev/firemonitoring-dev/firemonitoring-dev

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 0: Path-Based Change Detection
  # ─────────────────────────────────────────────────────────────
  detect_changes:
    name: "Detect Changed Services"
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set_services.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            dashboard:
              - 'apps/dashboard/**'
            etl-processor:
              - 'apps/etl-processor/**'
            db-migrations:
              - 'apps/db-migrations/**'
            mcu-simulator:
              - 'apps/simulators/**'

      - name: Determine Services to Build
        id: set_services
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          # On manual trigger or release tag → build everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || \
             [ -z "$CHANGES" ] || [ "$CHANGES" = "[]" ]; then
            echo 'services=["api", "dashboard", "etl-processor", "db-migrations", "mcu-simulator"]' >> $GITHUB_OUTPUT
          else
            echo "services=$CHANGES" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  # Stage 1: Build → Scan → Push
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # Stage 0.5: Test — Lint & Unit Tests (per changed service)
  # ─────────────────────────────────────────────────────────────
  test:
    name: "Test: ${{ matrix.service }}"
    needs: detect_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      # ── Node.js services (api) ──
      - name: Setup Node.js
        if: matrix.service == 'api'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install & Test (API)
        if: matrix.service == 'api'
        working-directory: apps/api
        run: |
          npm ci
          npm run lint -- --max-warnings=0 || true
          npm test

      # ── Python services (etl-processor) ──
      - name: Setup Python
        if: matrix.service == 'etl-processor'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/etl-processor/requirements.txt

      - name: Install & Test (ETL)
        if: matrix.service == 'etl-processor'
        working-directory: apps/etl-processor
        run: |
          pip install -r requirements.txt
          pytest --tb=short -q

      # ── Static services (dashboard, db-migrations, mcu-simulator) — no tests yet ──
      - name: Skip (no tests)
        if: matrix.service == 'dashboard' || matrix.service == 'db-migrations' || matrix.service == 'mcu-simulator'
        run: echo "No tests defined for ${{ matrix.service }} — skipping."

  build_scan_push:
    name: "Build & Scan: ${{ matrix.service }}"
    needs: [detect_changes, test]
    runs-on: ubuntu-latest
    environment: gke-dev
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect_changes.outputs.services) }}
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}"  >> $GITHUB_OUTPUT  # e.g. v1.0.0
          else
            echo "tag=${GITHUB_SHA::7}"        >> $GITHUB_OUTPUT  # e.g. 7542de2
          fi

      - name: Resolve Build Context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "db-migrations" ]; then
            echo "path=./apps/db-migrations" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" = "mcu-simulator" ]; then
            echo "path=./apps/simulators" >> $GITHUB_OUTPUT
          else
            echo "path=./apps/${{ matrix.service }}"  >> $GITHUB_OUTPUT
          fi

      # ── Step A: Build locally (no push) so Trivy can scan ──
      - name: Build Container Image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: false
          load: true
          tags: scan-target:${{ steps.set_tag.outputs.tag }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Step B: Vulnerability scan (non-blocking temporarily per user request) ──
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref:  scan-target:${{ steps.set_tag.outputs.tag }}
          format:     table
          exit-code:  '0'          # Non-blocking for now
          severity:   HIGH,CRITICAL
          trivyignores: .trivyignore

      # ── Step B.5: Authenticate to Google Cloud via WIF & Log in to GAR ──
      - name: Authenticate to Google Cloud via WIF
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format:               access_token

      - name: Log in to Google Artifact Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      # ── Step C: Push to registries (main merges and release tags only) ──
      - name: Push Container Image to GHCR & GAR
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.GAR_PREFIX }}/${{ matrix.service }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.GAR_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Stage 1.25: K8s Smoke Test — Runtime validation in Kind
  # ─────────────────────────────────────────────────────────────
  k8s_smoke_test:
    name: "K8s Smoke Test"
    needs: [detect_changes, build_scan_push]
    # Only run on PRs and main pushes (not on release tags — those go to prod)
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ── Create ephemeral Kind cluster (no hostPort mapping) ──
      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-smoke-test
          wait: 60s

      # ── Log in to GHCR to pull the images we just built ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Pull & load all changed service images into Kind ──
      - name: Load Images into Kind
        run: |
          TAG="${{ needs.build_scan_push.outputs.image_tag }}"
          for svc in $(echo '${{ needs.detect_changes.outputs.services }}' | jq -r '.[]'); do
            IMAGE="${{ env.IMAGE_PREFIX }}/${svc}:${TAG}"
            echo "📦 Loading ${IMAGE}..."
            if docker pull "${IMAGE}"; then
              docker tag "${IMAGE}" "localhost/${svc}:local"
              kind load docker-image "localhost/${svc}:local" --name ci-smoke-test
              kind load docker-image "${IMAGE}" --name ci-smoke-test 2>/dev/null || true
              echo "✅ Loaded localhost/${svc}:local into Kind"
            else
              echo "⚠️ Could not pull ${IMAGE} — may not be pushed yet on PRs"
            fi
          done

      # ── Create namespace & apply the local Kustomize overlay ──
      - name: Deploy Local Overlay
        run: |
          kubectl create namespace fire-monitoring-local --dry-run=client -o yaml | kubectl apply -f -
          # Prepare secrets stub for CI if needed
          [ ! -f infrastructure/k8s/overlays/local/secrets.yaml ] && \
            cp infrastructure/k8s/overlays/local/secrets.yaml.example infrastructure/k8s/overlays/local/secrets.yaml 2>/dev/null || true
          kubectl apply -k infrastructure/k8s/overlays/local

      # ── Wait for critical pods (tolerate observability pods failing) ──
      - name: Wait for Core Deployments Rollout
        run: |
          echo "⏳ Waiting for core deployments to roll out..."
          for deploy in api dashboard etl-processor; do
            kubectl rollout status deployment/${deploy} \
              -n fire-monitoring-local --timeout=120s 2>/dev/null || \
              echo "⚠️ ${deploy} did not become ready (may be expected if image wasn't pushed yet)"
          done

      # ── Verify pod statuses ──
      - name: Verify Pod Health
        run: |
          echo "📋 Pod statuses:"
          kubectl get pods -n fire-monitoring-local -o wide
          echo ""

          # Count CrashLoopBackOff pods
          CRASHES=$(kubectl get pods -n fire-monitoring-local \
            --field-selector=status.phase!=Succeeded \
            -o jsonpath='{.items[*].status.containerStatuses[?(@.state.waiting.reason=="CrashLoopBackOff")].name}' \
            | wc -w)

          if [ "$CRASHES" -gt 0 ]; then
            echo "❌ $CRASHES pod(s) in CrashLoopBackOff!"
            kubectl logs -n fire-monitoring-local -l app=api --tail=50 || true
            kubectl logs -n fire-monitoring-local -l app=etl-processor --tail=50 || true
            exit 1
          fi

          echo "✅ No CrashLoopBackOff pods detected."

      # ── Optional: API health check ──
      - name: API Health Check
        run: |
          kubectl port-forward -n fire-monitoring-local svc/api 8000:8000 &
          PF_PID=$!
          sleep 5
          if curl -sf http://127.0.0.1:8000/health; then
            echo "✅ API health check passed"
          else
            echo "⚠️ API health check failed (non-blocking for now)"
          fi
          kill $PF_PID 2>/dev/null || true
        continue-on-error: true

      # ── Cleanup (always runs) ──
      - name: Delete Kind Cluster
        if: always()
        run: kind delete cluster --name ci-smoke-test

  # ─────────────────────────────────────────────────────────────
  # Stage 1.5: CI Gate — Consolidated Status for PR Gates
  # Provides a single, stable check name for branch protection rules
  # ─────────────────────────────────────────────────────────────
  ci_gate:
    name: "CI Gate / All Checks Passed"
    needs: [detect_changes, test, build_scan_push, k8s_smoke_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Checks
        run: |
          echo "Detect changes status : ${{ needs.detect_changes.result }}"
          echo "Tests status          : ${{ needs.test.result }}"
          echo "Build & scan status   : ${{ needs.build_scan_push.result }}"
          echo "K8s smoke test status : ${{ needs.k8s_smoke_test.result }}"

          if [ "${{ needs.detect_changes.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build_scan_push.result }}" = "failure" ] || \
             [ "${{ needs.k8s_smoke_test.result }}" = "failure" ]; then
            echo "❌ One or more CI stages failed."
            exit 1
          fi
          echo "✅ All CI checks passed successfully."

  # ─────────────────────────────────────────────────────────────
  # Stage 2a: Dev Deploy — Direct Commit to overlays/dev
  # Triggers: push to main only (NOT on tags, NOT on PR)
  # ─────────────────────────────────────────────────────────────
  deploy_dev:
    name: "Deploy to Dev (GitOps direct commit)"
    needs: [detect_changes, build_scan_push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gke-dev

    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump Dev Overlay Image Tags
        run: |
          cd infrastructure/k8s/overlays/dev
          for service in $(echo '${{ needs.detect_changes.outputs.services }}' | jq -r '.[]'); do
            kustomize edit set image \
              "${service}=${{ env.GAR_PREFIX }}/${service}:${{ needs.build_scan_push.outputs.image_tag }}"
          done

      - name: Commit & Push Dev Overlay
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore(gitops/dev): bump images → ${{ needs.build_scan_push.outputs.image_tag }} [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────
  # Stage 2b: Prod Release — Open Promotion PR
  # Triggers: Git Release Tag push ONLY (v*.*.*)
  # ─────────────────────────────────────────────────────────────
  promote_prod:
    name: "Open Production Promotion PR"
    needs: [detect_changes, build_scan_push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: gke-prod

    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - uses: imranismail/setup-kustomize@v2

      - name: Bump Prod Overlay Image Tags
        run: |
          cd infrastructure/k8s/overlays/prod
          for service in $(echo '${{ needs.detect_changes.outputs.services }}' | jq -r '.[]'); do
            kustomize edit set image \
              "${service}=${{ env.IMAGE_PREFIX }}/${service}:${{ needs.build_scan_push.outputs.image_tag }}"
          done

      - name: Open Prod Promotion PR
        uses: peter-evans/create-pull-request@v6
        with:
          token:          ${{ steps.app_token.outputs.token }}
          commit-message: "chore(gitops/prod): promote release ${{ github.ref_name }}"
          title:          "🚀 Release ${{ github.ref_name }} → Production"
          body: |
            ## Production Promotion — ${{ github.ref_name }}

            This PR was automatically generated when release tag `${{ github.ref_name }}` was published.

            ### Services Updated
            ${{ needs.detect_changes.outputs.services }}

            ### Image Tag
            `${{ needs.build_scan_push.outputs.image_tag }}`

            ---
            **Review checklist before merging:**
            - [ ] Dev environment tested and stable
            - [ ] No critical Trivy findings requiring remediation
            - [ ] Changelog reviewed
          branch:        "release/prod-${{ github.ref_name }}"
          base:          main
          delete-branch: true
          labels:        "production-release,gitops"