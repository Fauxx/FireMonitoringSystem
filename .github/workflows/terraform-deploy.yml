name: "Infrastructure Pipeline Orchestrator (Dev)"

on:
  pull_request:
    branches: [ main ]
    paths:
      - "infrastructure/terraform/environments/dev/**"
      - "infrastructure/terraform/modules/**"
      - "infrastructure/terraform/global/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [ main ]
    paths:
      - "infrastructure/terraform/environments/dev/**"
      - "infrastructure/terraform/modules/**"
      - "infrastructure/terraform/global/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      layer:
        description: "Terraform layer to deploy"
        required: true
        type: choice
        options:
          - 01-infra
          - 02-platform
          - 03-argocd
          - all
        default: all
      execution_mode:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - plan-only
          - apply
        default: plan-only

concurrency:
  group: terraform-deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  # -------------------------------------------------------------
  # 1. Pull Request Gated Speculative Validation Phase
  # -------------------------------------------------------------
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'plan-only')
    strategy:
      fail-fast: true
      matrix:
        layer: ["01-infra", "02-platform", "03-argocd"]
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/${{ matrix.layer }}"
      env: "dev"
      mode: "validate"
    secrets: inherit

  # -------------------------------------------------------------
  # 2. Main Branch Push or Manual Production-Gated Apply Phase ss
  # -------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply')
    strategy:
      fail-fast: true
      matrix:
        layer: ["01-infra", "02-platform", "03-argocd"]
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/${{ matrix.layer }}"
      env: "dev"
      mode: "deploy"
    secrets: inherit