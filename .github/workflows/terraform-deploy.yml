name: "Infrastructure Pipeline Orchestrator (Dev)"

on:
  pull_request:
    branches: [ main ]
    paths:
      - "infrastructure/terraform/environments/dev/**"
      - "infrastructure/terraform/modules/**"
      - "infrastructure/terraform/global/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [ main ]
    paths:
      - "infrastructure/terraform/environments/dev/**"
      - "infrastructure/terraform/modules/**"
      - "infrastructure/terraform/global/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      layer:
        description: "Target layer to execute (Applies to manual execution modes)"
        required: true
        type: choice
        options:
          - 01-infra
          - 02-platform
          - 03-argocd
          - all
        default: all
      execution_mode:
        description: "Execution execution track"
        required: true
        type: choice
        options:
          - plan-only
          - apply
        default: plan-only

concurrency:
  group: terraform-deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  environments: write
  secrets: write
  actions: write

jobs:
  # ==============================================================================
  # LAYER 1: VALIDATE (Runs concurrently for fast PR status checks)
  # ==============================================================================
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'plan-only' && inputs.layer == 'all')
    strategy:
      fail-fast: true
      matrix:
        include:
          - layer: "00-bootstrap"
            layer_kind: "bootstrap"
          - layer: "01-infra"
            layer_kind: "infra"
          - layer: "02-platform"
            layer_kind: "platform"
          - layer: "03-argocd"
            layer_kind: "gitops"
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/${{ matrix.layer }}"
      layer_kind: ${{ matrix.layer_kind }}
      env: "dev"
      mode: "validate"
    secrets: inherit

  # ==============================================================================
  # LAYER 2: SEQUENTIAL DEPLOYMENT (Prevents state cross-talk & data race loops)
  # ==============================================================================

  deploy_bootstrap:
    name: "Deploy: Bootstrap Layer (00)"
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_dispatch' && 
       inputs.execution_mode == 'apply' && 
       (inputs.layer == '00-bootstrap' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/00-bootstrap"
      layer_kind: "bootstrap"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_infra:
    name: "Deploy: Infrastructure Layer (01)"
    needs: deploy_bootstrap
    if: |
      always() &&
      (github.event_name == 'push' && (needs.deploy_bootstrap.result == 'success' || needs.deploy_bootstrap.result == 'skipped')) || 
      (github.event_name == 'workflow_dispatch' && 
       inputs.execution_mode == 'apply' && 
       (inputs.layer == '01-infra' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/01-infra"
      layer_kind: "infra"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_platform:
    name: "Deploy: Platform Core Layer (02)"
    needs: deploy_infra
    # Aligned status tracking: Runs on direct main branch merges or targeted manual override runs
    if: |
      always() &&
      (github.event_name == 'push' && (needs.deploy_infra.result == 'success' || needs.deploy_infra.result == 'skipped')) ||
      (github.event_name == 'workflow_dispatch' && 
       inputs.execution_mode == 'apply' && 
       (inputs.layer == '02-platform' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/02-platform"
      layer_kind: "platform"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_argocd:
    name: "Deploy: GitOps ArgoCD Layer (03)"
    needs: deploy_platform
    # Aligned status tracking: Ensures upstream dependencies match execution parameters safely
    if: |
      always() &&
      (github.event_name == 'push' && (needs.deploy_platform.result == 'success' || needs.deploy_platform.result == 'skipped')) ||
      (github.event_name == 'workflow_dispatch' && 
       inputs.execution_mode == 'apply' && 
       (inputs.layer == '03-argocd' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/03-argocd"
      layer_kind: "gitops"
      env: "dev"
      mode: "deploy"
    secrets: inherit