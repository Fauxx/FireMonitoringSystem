name: "GCP Terraform (Reusable)"
on:
  workflow_call:
    inputs:
      environment:    { required: true, type: string }
      layer_dir:      { required: true, type: string }
      execution_mode: { required: true, type: string }
    secrets:
      APP_ID: { required: false }
      APP_INSTALLATION_ID: { required: false }
      APP_PRIVATE_KEY: { required: false }
      CLOUDFLARE_TUNNEL_CREDENTIALS_JSON: { required: false }

jobs:
  terraform_plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - run: echo "Plan for ${{ inputs.layer_dir }} in ${{ inputs.environment }}"
