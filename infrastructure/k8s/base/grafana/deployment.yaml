apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: fire-monitoring-config
            - secretRef:
                name: fire-monitoring-secrets
          env:
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: fire-monitoring-config
                  key: GRAFANA_ROOT_URL
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: "X-WEBAUTH-USER"
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: "username"
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_AUTH_PROXY_HEADERS
              value: "Role:X-WEBAUTH-ROLE"
            - name: GF_AUTH_PROXY_SYNC_TTL
              value: "60"
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
              subPath: grafana-data
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
            - name: grafana-dashboards-telemetry
              mountPath: /etc/grafana/dashboards/telemetry
            - name: grafana-dashboards-infrastructure
              mountPath: /etc/grafana/dashboards/infrastructure
            - name: grafana-dashboards-application
              mountPath: /etc/grafana/dashboards/application
            - name: grafana-dashboards-datalayer
              mountPath: /etc/grafana/dashboards/data-layer
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: influxdb.yaml
                path: datasources/influxdb.yaml
              - key: loki.yaml
                path: datasources/loki.yaml
              - key: prometheus.yaml
                path: datasources/prometheus.yaml
              - key: dashboards.yaml
                path: dashboards/dashboards.yaml
        - name: grafana-dashboards-telemetry
          configMap:
            name: grafana-dashboards-telemetry
        - name: grafana-dashboards-infrastructure
          configMap:
            name: grafana-dashboards-infrastructure
        - name: grafana-dashboards-application
          configMap:
            name: grafana-dashboards-application
        - name: grafana-dashboards-datalayer
          configMap:
            name: grafana-dashboards-datalayer

