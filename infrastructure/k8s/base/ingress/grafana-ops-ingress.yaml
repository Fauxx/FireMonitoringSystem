apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ops
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: grafana-ops-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - Ops"
spec:
  ingressClassName: nginx
  rules:
    - host: ops.dev.fires.systems
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
