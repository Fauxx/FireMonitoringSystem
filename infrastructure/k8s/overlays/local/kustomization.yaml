apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-local

configMapGenerator:
- name: fire-monitoring-config
  behavior: replace
  envs:
    - local-public.env

resources:
- ../../base
- secrets.yaml

replicas:
  - name: prometheus
    count: 1
  - name: loki
    count: 1

images:
- name: api
  newName: localhost/api
  newTag: local
- name: dashboard
  newName: localhost/dashboard
  newTag: local
- name: etl-processor
  newName: localhost/etl-processor
  newTag: local
- name: db-migrations
  newName: localhost/db-migrations
  newTag: local

labels:
- includeSelectors: true
  pairs:
    deployment-type: local
    environment: local

patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: dashboard
    patch: |
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: etl-processor
    patch: |
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
      name: flyway-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Remove cloudflared — local manifest testing uses port-forward only.
  # The tunnel is only needed in dev/prod overlays where it runs in-cluster.
  - target:
      kind: Deployment
      name: cloudflared
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
  - target:
      kind: ConfigMap
      name: cloudflared-config
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cloudflared-config
