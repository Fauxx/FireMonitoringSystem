name: Terraform Validate (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-validate.yml"

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5.0"

      - name: Terraform Format Check
        run: terraform -chdir=infrastructure/terraform fmt -recursive -check -diff

  terraform-validate:
    needs: terraform-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        layer:
          - dev/01-infra
          - dev/02-platform
          - dev/03-argocd
    defaults:
      run:
        shell: bash
        working-directory: infrastructure/terraform/environments/${{ matrix.layer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5.0"

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color
