apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-prod

resources:
  - ../../base

patchesStrategicMerge:
  - ingress-patch.yaml
  - api-replicas-patch.yaml
  - dashboard-replicas-patch.yaml

patchesJson6902:
  - target:
      group: v1
      version: v1
      kind: Service
      name: nginx-ingress-controller
      namespace: ingress-nginx
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

images:
  - name: api
    newName: ghcr.io/fauxx/firemonitoringsystem/api
    newTag: sha-000000000000
  - name: etl-processor
    newName: ghcr.io/fauxx/firemonitoringsystem/etl-processor
    newTag: sha-000000000000
  - name: dashboard
    newName: ghcr.io/fauxx/firemonitoringsystem/dashboard
    newTag: sha-000000000000

commonLabels:
  environment: prod
  deployment-type: production

