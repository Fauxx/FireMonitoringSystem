[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true   
  quiet = false
  logfile = ""
  hostname = ""
  omit_hostname = false

[[inputs.mqtt_consumer]]
  # Changed from mqtt-broker to mqtt to match your docker-compose service name
  servers = ["tcp://mqtt:1883"] 
  topics = ["fire/sensors/#"] 
  data_format = "json_v2"
  name_override = "node_telemetry"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "node_telemetry"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z" # ISO 8601 UTC

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "status_code"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "readings.temperature_c"
      rename = "temperature_c"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "readings.smoke_ppm"
      rename = "smoke_ppm"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "readings.flame_intensity"
      rename = "flame_intensity"
      type = "float"

[[outputs.influxdb_v2]]
  # Changed from influxdb to influx to match your docker-compose service name
  urls = ["http://influx:8086"] 
  token = "${INFLUXDB_TOKEN}" 
  organization = "fire-monitoring" 
  bucket = "sensor-data"