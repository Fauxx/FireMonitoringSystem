name: terraform-contract
description: Shared Terraform init/environment/secrets contract for CI/CD workflows

inputs:
  working_directory:
    description: Terraform working directory
    required: false
    default: infrastructure/terraform/environments/dev
  environment_name:
    description: Environment directory name (dev/prod)
    required: false
    default: dev
  layer_kind:
    description: Layer profile (infra, platform, gitops)
    required: false
    default: infra
  use_backend:
    description: Whether to initialize configured backend
    required: false
    default: "false"
  require_secrets:
    description: Whether bootstrap secrets are required
    required: false
    default: "false"

  do_token:
    description: DigitalOcean API token
    required: false
    default: ""
  github_owner:
    description: GitHub owner (user or organization)
    required: false
    default: ""
  github_repo:
    description: GitHub repository name
    required: false
    default: ""
  argocd_server:
    description: Argo CD server endpoint (for workflows)
    required: false
    default: ""
  argocd_auth_token:
    description: Argo CD auth token (for workflows/image updater)
    required: false
    default: ""
  ssh_key_ids:
    description: HCL list literal of DigitalOcean SSH key IDs/fingerprints
    required: false
    default: ""
  do_ssh_host_fingerprint:
    description: SSH host fingerprint in SHA256 format
    required: false
    default: ""

  do_ssh_host:
    description: Deploy host public IP
    required: false
    default: ""
  do_ssh_port:
    description: Deploy host SSH port
    required: false
    default: ""
  do_ssh_user:
    description: Deploy host SSH user
    required: false
    default: ""

  github_app_id:
    description: GitHub App ID
    required: false
    default: ""
  github_app_installation_id:
    description: GitHub App Installation ID
    required: false
    default: ""
  github_app_private_key:
    description: GitHub App private key (PEM format)
    required: false
    default: ""
  ghcr_deploy_username:
    description: GHCR container registry username
    required: false
    default: ""
  ghcr_deploy_token:
    description: GHCR container registry token
    required: false
    default: ""

  remote_state_bucket:
    description: Remote state bucket name
    required: false
    default: ""
  remote_state_key:
    description: Remote state key path
    required: false
    default: ""
  remote_state_region:
    description: Remote state region
    required: false
    default: ""
  remote_state_endpoint:
    description: Remote state endpoint
    required: false
    default: ""
  remote_state_skip_credentials_validation:
    description: Skip remote state credentials validation
    required: false
    default: "true"
  remote_state_skip_metadata_api_check:
    description: Skip remote state metadata API check
    required: false
    default: "true"
  remote_state_skip_region_validation:
    description: Skip remote state region validation
    required: false
    default: "true"
  remote_state_skip_requesting_account_id:
    description: Skip remote state requesting account ID
    required: false
    default: "true"
  remote_state_use_path_style:
    description: Use path-style for remote state S3 endpoint
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate Terraform environment format
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TF_ENVIRONMENT: ${{ inputs.environment_name }}
      run: |
        set -euo pipefail
        if [[ -z "${TF_ENVIRONMENT}" ]]; then
          echo "environment_name cannot be empty"
          exit 1
        fi

        if [[ ! "${TF_ENVIRONMENT}" =~ ^[a-z0-9][a-z0-9_-]{1,62}$ ]]; then
          echo "environment_name '${TF_ENVIRONMENT}' is invalid; use lowercase letters, numbers, '_' or '-' (2-63 chars)."
          exit 1
        fi

    - name: Verify bootstrap vs post-provision secrets
      if: ${{ inputs.require_secrets == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        LAYER_KIND: ${{ inputs.layer_kind }}
        DO_TOKEN_INPUT: ${{ inputs.do_token }}
        DO_TOKEN_INHERITED: ${{ env.DO_TOKEN }}
        TF_VAR_DO_TOKEN: ${{ env.TF_VAR_do_token }}
        TF_STATE_ACCESS_KEY: ${{ env.TF_STATE_ACCESS_KEY }}
        TF_STATE_SECRET_KEY: ${{ env.TF_STATE_SECRET_KEY }}
        GITHUB_APP_ID: ${{ inputs.github_app_id }}
        GITHUB_APP_INSTALLATION_ID: ${{ inputs.github_app_installation_id }}
        GITHUB_APP_PRIVATE_KEY: ${{ inputs.github_app_private_key }}
      run: |
        set -euo pipefail

        effective_do_token="${DO_TOKEN_INPUT:-}"
        if [ -z "${effective_do_token}" ]; then
          effective_do_token="${DO_TOKEN_INHERITED:-}"
        fi
        if [ -z "${effective_do_token}" ]; then
          effective_do_token="${TF_VAR_DO_TOKEN:-}"
        fi
        export DO_TOKEN="${effective_do_token}"

        case "${LAYER_KIND}" in
          bootstrap)
            required_vars=("DO_TOKEN" "TF_STATE_ACCESS_KEY" "TF_STATE_SECRET_KEY")
            ;;
          infra)
            required_vars=("DO_TOKEN")
            ;;
          platform)
            required_vars=("DO_TOKEN" "GITHUB_APP_ID" "GITHUB_APP_INSTALLATION_ID" "GITHUB_APP_PRIVATE_KEY" "TF_STATE_ACCESS_KEY" "TF_STATE_SECRET_KEY")
            ;;
          gitops)
            required_vars=("DO_TOKEN" "GITHUB_APP_ID" "GITHUB_APP_INSTALLATION_ID" "GITHUB_APP_PRIVATE_KEY")
            ;;
          *)
            echo "Unknown layer_kind '${LAYER_KIND}'"
            exit 1
            ;;
        esac

        missing_bootstrap=()
        for required_var in "${required_vars[@]}"; do
          [ -n "${!required_var:-}" ] || missing_bootstrap+=("${required_var}")
        done

        if [ "${#missing_bootstrap[@]}" -gt 0 ]; then
          printf 'Missing bootstrap-required secret(s) for %s: %s\n' "${LAYER_KIND}" "${missing_bootstrap[*]}"
          exit 1
        fi

    - name: Build runtime tfvars
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        REQUIRE_SECRETS: ${{ inputs.require_secrets }}
        LAYER_KIND: ${{ inputs.layer_kind }}
        DO_TOKEN_INPUT: ${{ inputs.do_token }}
        DO_TOKEN_INHERITED: ${{ env.DO_TOKEN }}
        TF_VAR_DO_TOKEN: ${{ env.TF_VAR_do_token }}
        TF_STATE_ACCESS_KEY: ${{ env.TF_STATE_ACCESS_KEY }}
        TF_STATE_SECRET_KEY: ${{ env.TF_STATE_SECRET_KEY }}
        GITHUB_APP_ID: ${{ inputs.github_app_id }}
        GITHUB_APP_INSTALLATION_ID: ${{ inputs.github_app_installation_id }}
        GITHUB_APP_PRIVATE_KEY: ${{ inputs.github_app_private_key }}
        REMOTE_STATE_BUCKET: ${{ inputs.remote_state_bucket }}
        REMOTE_STATE_KEY: ${{ inputs.remote_state_key }}
        REMOTE_STATE_REGION: ${{ inputs.remote_state_region }}
        REMOTE_STATE_SKIP_CREDENTIALS_VALIDATION: ${{ inputs.remote_state_skip_credentials_validation }}
        REMOTE_STATE_SKIP_METADATA_API_CHECK: ${{ inputs.remote_state_skip_metadata_api_check }}
        REMOTE_STATE_SKIP_REGION_VALIDATION: ${{ inputs.remote_state_skip_region_validation }}
        REMOTE_STATE_SKIP_REQUESTING_ACCOUNT_ID: ${{ inputs.remote_state_skip_requesting_account_id }}
        REMOTE_STATE_USE_PATH_STYLE: ${{ inputs.remote_state_use_path_style }}
      run: |
        set -euo pipefail
        rm -f runtime.auto.tfvars

        effective_do_token="${DO_TOKEN_INPUT:-}"
        if [ -z "${effective_do_token}" ]; then
          effective_do_token="${DO_TOKEN_INHERITED:-}"
        fi
        if [ -z "${effective_do_token}" ]; then
          effective_do_token="${TF_VAR_DO_TOKEN:-}"
        fi
        export DO_TOKEN="${effective_do_token}"

        if [ "${REQUIRE_SECRETS}" = "true" ]; then
          case "${LAYER_KIND}" in
            infra)
              {
                printf 'do_token = "%s"\n' "${DO_TOKEN}"
              } > runtime.auto.tfvars
              ;;
            platform)
              {
                printf 'do_token = "%s"\n' "${DO_TOKEN}"
                printf 'github_app_id = "%s"\n' "${GITHUB_APP_ID}"
                printf 'github_app_installation_id = "%s"\n' "${GITHUB_APP_INSTALLATION_ID}"
                printf 'github_app_state_access_key = "%s"\n' "${TF_STATE_ACCESS_KEY}"
                printf 'github_app_state_secret_key = "%s"\n' "${TF_STATE_SECRET_KEY}"
              } > runtime.auto.tfvars
              ;;
            gitops)
              {
                printf 'do_token = "%s"\n' "${DO_TOKEN}"
                printf 'github_app_id = "%s"\n' "${GITHUB_APP_ID}"
                printf 'github_app_installation_id = "%s"\n' "${GITHUB_APP_INSTALLATION_ID}"
              } > runtime.auto.tfvars
              ;;
            bootstrap)
              {
                printf 'do_token = "%s"\n' "${DO_TOKEN}"
                printf 'github_app_state_access_key = "%s"\n' "${TF_STATE_ACCESS_KEY}"
                printf 'github_app_state_secret_key = "%s"\n' "${TF_STATE_SECRET_KEY}"
                printf 'state_bucket_name = "%s"\n' "${TF_VAR_remote_state_bucket}"
              } > runtime.auto.tfvars
              ;;
            *)
              echo "Unknown layer_kind '${LAYER_KIND}'"
              exit 1
              ;;
          esac
          
          # Clean up the generated file formatting so strict CI checks pass
          terraform fmt runtime.auto.tfvars || true
        fi

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        USE_BACKEND: ${{ inputs.use_backend }}
      run: |
        set -euo pipefail
        common_backend_config="../../../backend-common.conf"
        layer_backend_config="backend.conf"

        if [ "${USE_BACKEND:-true}" = "true" ]; then
          if [ ! -f "${common_backend_config}" ]; then
            echo "Missing shared backend config: ${common_backend_config}"
            exit 1
          fi

          if [ ! -f "${layer_backend_config}" ]; then
            echo "Missing layer backend config: ${layer_backend_config}"
            exit 1
          fi

          terraform init -upgrade -reconfigure -input=false \
            -backend-config="${common_backend_config}" \
            -backend-config="${layer_backend_config}"
        else
          terraform init -upgrade -backend=false -input=false
        fi

