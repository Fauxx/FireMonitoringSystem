<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Command Center - Operations Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Sleek Command Center Design System */
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Operations Dashboard Layout */
    #main-content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    /* Top Control & Operations Header */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #111723;
      border: 1px solid #1e293b;
      padding: 12px 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .panel-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .panel-indicator {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      margin: 0;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Clean Sleek UI Buttons */
    .tactile-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .tactile-btn:hover {
      background: #334155;
      color: #f8fafc;
      border-color: #475569;
    }

    .tactile-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0ea5e9;
      box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
    }

    /* Red Escape Exit Button */
    .exit-btn {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .exit-btn:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    /* Grid Alignment Structure */
    .monitor-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex-grow: 1;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    /* Responsive Columns */
    .monitor-grid.grid-1 {
      grid-template-columns: 1fr;
    }

    .monitor-grid.grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .monitor-grid.grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    @media (max-width: 1200px) {
      .monitor-grid, .monitor-grid.grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .monitor-grid, .monitor-grid.grid-2, .monitor-grid.grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* Monitor Cards */
    .monitor-frame {
      border: 1px solid #1e293b;
      border-radius: 8px;
      background-color: #0f172a;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
      box-sizing: border-box;
    }

    .monitor-header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    .monitor-header .scan-status {
      font-size: 0.75rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .monitor-content {
      flex-grow: 1;
      position: relative;
      background: #000000;
    }

    .monitor-content iframe {
      border: none;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    /* Pulsing Critical Warning Cards */
    @keyframes border-glow-red {
      0% { border-color: rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
      100% { border-color: rgba(239, 68, 68, 0.4); }
    }

    .monitor-frame.pulse-red {
      animation: border-glow-red 2s infinite;
      border-color: #ef4444;
    }

    .monitor-frame.pulse-red .monitor-header {
      background-color: rgba(239, 68, 68, 0.1);
      border-bottom-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .monitor-frame.pulse-red .scan-status {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      animation: pulse-opacity 1s infinite alternate;
    }

    @keyframes pulse-opacity {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Operations Bottom Status Ticker */
    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      height: 32px;
      background-color: #111723;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      font-size: 0.8rem;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    .ticker {
      display: inline-block;
      white-space: nowrap;
      padding-right: 100%;
      animation: marquee 40s linear infinite;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes marquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .live-clock {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      background-color: #111723;
      border-left: 1px solid #1e293b;
      padding: 0 18px;
      display: flex;
      align-items: center;
      z-index: 101;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      box-shadow: -10px 0 15px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- Main Grid Content Viewport -->
  <main id="main-content">
    
    <!-- Top Operations Header Panel -->
    <header class="control-panel">
      <div class="panel-left">
        <div class="panel-indicator"></div>
        <div class="panel-title">OPS COMMAND CENTER</div>
      </div>
      <nav class="filter-group">
        <button class="tactile-btn active" data-filter="SYS_ALL">ALL MONITORS</button>
        <button class="tactile-btn" data-filter="TELEMETRY">TELEMETRY</button>
        <button class="tactile-btn" data-filter="INFRA">INFRASTRUCTURE</button>
        <button class="tactile-btn" data-filter="APPS">APPLICATIONS</button>
        <div style="width: 1px; height: 16px; background-color: #334155; margin: 0 8px;"></div>
        <button class="tactile-btn exit-btn" onclick="window.location.href='/protected/dashboard.html'">[EXIT CC]</button>
      </nav>
    </header>

    <!-- Monitoring Node Grid -->
    <section class="monitor-grid" id="monitor-grid">
      <!-- Injected dynamically via JS -->
    </section>

    <!-- Bottom Status Log Ticker -->
    <footer class="ticker-wrap">
      <div class="ticker" id="ticker-text">
        CONSOLE_SESSION: SECURE // INSTANCE: ACTIVE // DB_LINK: VERIFIED // RECON_LINK: OK // NODE_FEED: SECURED // ALL_METRICS_NOMINAL // STAGE: RUNNING // NO_ALERT_TRIGGERED // ONLINE MONITORING IN PROGRESS...
      </div>
      <div class="live-clock" id="live-clock">[0000-00-00 00:00:00]</div>
    </footer>
  </main>

  <!-- Session auth checking loaded via script.js -->
  <script src="/protected/script.js"></script>
  <script>
    // System Dashboards Configurations
    const dashboards = [
      {
        uid: 'fire-main',
        title: 'TELEMETRY: SENSOR OVERVIEW',
        category: 'TELEMETRY',
        alert: false
      },
      {
        uid: 'cluster-health',
        title: 'INFRA: CLUSTER HEALTH',
        category: 'INFRA',
        alert: false
      },
      {
        uid: 'postgres-health',
        title: 'INFRA: DATABASE PERFORMANCE',
        category: 'INFRA',
        alert: false
      },
      {
        uid: 'mqtt-broker',
        title: 'INFRA: MQTT MESSAGE BROKER',
        category: 'INFRA',
        alert: false
      },
      {
        uid: 'api-performance',
        title: 'APP: API PERFORMANCE',
        category: 'APPS',
        alert: false
      },
      {
        uid: 'loki-error-logs',
        title: 'APP: LOG MONITOR (SYSTEM ERRORS)',
        category: 'APPS',
        alert: true // Red warning style
      }
    ];

    // Render operations dashboards
    function renderMonitors(filter) {
      const grid = document.getElementById('monitor-grid');
      grid.innerHTML = '';

      // Filter based on active selection
      const activeDashboards = dashboards.filter(db => {
        if (filter === 'SYS_ALL') return true;
        return db.category === filter;
      });

      // Adjust grid columns layout class
      grid.className = 'monitor-grid';
      if (activeDashboards.length === 1) {
        grid.classList.add('grid-1');
      } else if (activeDashboards.length === 2) {
        grid.classList.add('grid-2');
      } else {
        grid.classList.add('grid-3');
      }

      // Generate monitor cards
      activeDashboards.forEach((db, index) => {
        const frame = document.createElement('div');
        frame.className = `monitor-frame ${db.alert ? 'pulse-red' : ''}`;

        const header = document.createElement('div');
        header.className = 'monitor-header';
        
        const monitorTitle = document.createElement('span');
        monitorTitle.textContent = db.title;
        header.appendChild(monitorTitle);

        const status = document.createElement('span');
        status.className = 'scan-status';
        status.textContent = db.alert ? 'CRITICAL' : 'NOMINAL';
        header.appendChild(status);

        const content = document.createElement('div');
        content.className = 'monitor-content';

        // Embed the Grafana dashboard in kiosk mode using SAMEORIGIN routing
        const iframe = document.createElement('iframe');
        iframe.src = `/grafana/d/${db.uid}?orgId=1&refresh=5s&kiosk&theme=dark`;
        iframe.loading = 'lazy';
        iframe.setAttribute('allowfullscreen', 'true');
        content.appendChild(iframe);

        frame.appendChild(header);
        frame.appendChild(content);
        grid.appendChild(frame);
      });

      console.log(`📡 Injected ${activeDashboards.length} operations iframe monitors for: ${filter}`);
    }

    // Initialization & Event hooks
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initial monitors render
      renderMonitors('SYS_ALL');

      // 2. Tab switching logic
      const filterButtons = document.querySelectorAll('.tactile-btn:not(.exit-btn)');
      filterButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          filterButtons.forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');

          const selectedFilter = e.currentTarget.getAttribute('data-filter');
          renderMonitors(selectedFilter);
        });
      });

      // 3. Status Ticker Live Updating clock
      function updateLiveClock() {
        const clockEl = document.getElementById('live-clock');
        if (clockEl) {
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          clockEl.textContent = `[${year}-${month}-${day} ${hours}:${minutes}:${seconds}]`;
        }
      }
      setInterval(updateLiveClock, 1000);
      updateLiveClock();

      // 4. Force sidebar standard navigation panel hidden
      const checkInterval = setInterval(() => {
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');
        if (toggleBtn && sidebar) {
          clearInterval(checkInterval);
          // If sidebar state is visible, click toggleBtn to collapse it for full screen command layout
          if (sidebar.style.transform !== 'translateX(-260px)') {
            toggleBtn.click();
          }
        }
      }, 50);
    });
  </script>
</body>
</html>
