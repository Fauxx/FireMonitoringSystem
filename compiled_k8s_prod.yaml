kind: ConfigMap
metadata:
  labels:
    deployment-type: production
    environment: prod
  name: cloudflared-config
  namespace: fire-monitoring-prod
---
apiVersion: v1
data:
  default.conf: "map $http_x_forwarded_proto $pass_x_forwarded_proto {\n    default
    \         $http_x_forwarded_proto;\n    ''               $scheme;\n}\n\n# Map
    backend user roles to Grafana organization roles\nmap $user_role $grafana_role
    {\n    default          Viewer;\n    \"admin\"          Admin;\n}\n\nserver {\n
    \   listen 80;\n    server_name _;\n    \n    root /usr/share/nginx/html;\n    index
    login.html index.html;\n    \n    # Logging\n    access_log /var/log/nginx/dashboard-access.log;\n
    \   error_log /var/log/nginx/dashboard-error.log;\n    \n    # Security headers\n
    \   add_header X-Frame-Options \"SAMEORIGIN\" always;\n    add_header X-Content-Type-Options
    \"nosniff\" always;\n    add_header X-XSS-Protection \"1; mode=block\" always;\n
    \   add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\n    add_header
    Permissions-Policy \"geolocation=(), microphone=(), camera=()\" always;\n    \n
    \   # Performance: Client timeouts\n    client_body_timeout 30s;\n    client_header_timeout
    30s;\n    keepalive_timeout 65s;\n    \n    # Max upload size\n    client_max_body_size
    50M;\n    \n    # Gzip compression\n    gzip on;\n    gzip_vary on;\n    gzip_types
    text/plain text/css application/json application/javascript text/xml application/xml
    application/xml+rss text/javascript application/x-font-ttf application/x-font-opentype
    application/vnd.ms-fontobject image/svg+xml;\n    gzip_min_length 1024;\n    gzip_disable
    \"msie6\";\n    \n    # Primary routing\n    location / {\n        try_files $uri
    $uri/ /login.html;\n    }\n\n    # Global redirect for unauthorized requests (auth_request
    401)\n    error_page 401 = @error401;\n    location @error401 {\n        return
    302 /login.html?message=unauthorized;\n    }\n\n    # Protected pages - Protect
    using auth_request pointing to internal verify location\n    location /protected/
    {\n        auth_request /internal-auth-verify;\n        try_files $uri $uri/ =404;\n
    \   }\n    \n    # Internal location for auth verification (prevents body-related
    timeouts)\n    location = /internal-auth-verify {\n        internal;\n        proxy_pass
    http://api:8000/auth/verify;\n        proxy_pass_request_body off;\n        proxy_set_header
    Content-Length \"\";\n        proxy_set_header X-Original-URI $request_uri;\n
    \       \n        # Propagate headers from original request if needed\n        proxy_set_header
    Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header
    X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto
    $pass_x_forwarded_proto;\n    }\n    \n    # Safety net for Grafana's relative
    path failures\n    location /public/build {\n        return 301 /grafana$request_uri;\n
    \   }\n    \n    # API proxy (routes /api requests to backend API service)\n    location
    ^~ /api {\n        proxy_pass http://api:8000;\n        proxy_http_version 1.1;\n
    \       proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection
    'upgrade';\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP
    $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n
    \       proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;\n        proxy_cache_bypass
    $http_upgrade;\n        proxy_read_timeout 60s;\n        proxy_connect_timeout
    60s;\n    }\n\n    # Auth proxy (for login/signup)\n    location ^~ /auth {\n
    \       proxy_pass http://api:8000;\n        proxy_http_version 1.1;\n        proxy_set_header
    Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header
    X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto
    $pass_x_forwarded_proto;\n    }\n\n    # Messages proxy\n    location ^~ /messages
    {\n        proxy_pass http://api:8000;\n        proxy_http_version 1.1;\n        proxy_set_header
    Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header
    X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto
    $pass_x_forwarded_proto;\n    }\n    \n    # Grafana proxy (proxies directly to
    Grafana with Nginx auth_request)\n    location ^~ /grafana {\n        auth_request
    /internal-auth-verify;\n        \n        # Extract X-WEBAUTH-USER and User-Role
    from the auth_request subrequest response\n        auth_request_set $webauth_user
    $upstream_http_x_webauth_user;\n        auth_request_set $user_role $upstream_http_x_user_role;\n
    \       \n        proxy_pass http://grafana:3000;\n        \n        proxy_set_header
    Host $http_host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header
    X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto
    $pass_x_forwarded_proto;\n        \n        # Inject the authenticated username
    into the proxy request to Grafana\n        proxy_set_header X-WEBAUTH-USER $webauth_user;\n
    \       \n        # Inject the user's mapped role into the proxy request to enforce
    Viewer/Admin permissions\n        proxy_set_header X-WEBAUTH-ROLE $grafana_role;\n
    \       \n        # Crucial for iFrames and websockets to load assets smoothly\n
    \       proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n
    \       proxy_set_header Connection \"upgrade\";\n\n        # Override security
    headers for Grafana to allow iframe embedding\n        add_header X-Frame-Options
    \"SAMEORIGIN\" always;\n        add_header X-Content-Type-Options \"nosniff\"
    always;\n        add_header X-XSS-Protection \"1; mode=block\" always;\n        add_header
    Referrer-Policy \"strict-origin-when-cross-origin\" always;\n        add_header
    Permissions-Policy \"geolocation=(), microphone=(), camera=()\" always;\n    }\n\n
    \   # Static assets - cache them\n    location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$
    {\n        expires 30d;\n        add_header Cache-Control \"public, immutable\";\n
    \       access_log off;\n    }\n    \n    # Health check endpoint\n    location
    /health {\n        return 200 \"OK\\n\";\n        add_header Content-Type text/plain;\n
    \       access_log off;\n    }\n    \n    # Deny access to sensitive files\n    location
    ~ /\\. {\n        deny all;\n        access_log off;\n        log_not_found off;\n
    \   }\n    \n    location ~ ~$ {\n        deny all;\n        access_log off;\n
    \       log_not_found off;\n    }\n}\n"
