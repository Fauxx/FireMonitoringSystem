apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-dev

configMapGenerator:
- name: fire-monitoring-config
  behavior: replace
  envs:
    - dev-public.env

resources:
- ../../base

replicas:
  - name: prometheus
    count: 0
  - name: loki
    count: 0


images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem/api
  newTag: 3c4651f
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem/dashboard
  newTag: 3c4651f
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem/etl-processor
  newTag: 3c4651f

labels:
- includeSelectors: true
  pairs:
    deployment-type: development
    environment: dev
patches:
- path: ingress-patch.yaml
