apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-dev

configMapGenerator:
- envs:
  - dev-public.env
  name: fire-monitoring-config

resources:
- ../../base
- collaboration-rbac.yaml

replicas:
- count: 1
  name: prometheus
- count: 1
  name: loki

images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/api
  newTag: 43f2fcc
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/dashboard
  newTag: 2c054b2
- name: db-migrations
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/db-migrations
  newTag: b9f3566
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/etl-processor
  newTag: cead6ea
- name: mcu-simulator
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/mcu-simulator
  newTag: cead6ea

labels:
- includeSelectors: true
  pairs:
    deployment-type: development
    environment: dev

patches:
- path: ingress-patch.yaml
- path: mqtt-service-patch.yaml
- patch: |-
    - op: add
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: standard-rwo
  target:
    kind: StatefulSet
    name: influx
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: grafana-data
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: prometheus-data
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: loki-data
- patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
  target:
    kind: Deployment
    name: api
- patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
  target:
    kind: Deployment
    name: dashboard
- patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
  target:
    kind: Deployment
    name: etl-processor
