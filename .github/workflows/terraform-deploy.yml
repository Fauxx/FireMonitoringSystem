name: "Infrastructure Pipeline Orchestrator"

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-deploy.yml"
      - ".github/workflows/terraform-reusable.yml"
      - ".github/actions/**"
  push:
    branches: [ main ]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-deploy.yml"
      - ".github/workflows/terraform-reusable.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to execute (Applies to manual execution modes)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      layer:
        description: "Target layer to execute (Applies to manual execution modes)"
        required: true
        type: choice
        options:
          - 01-infra
          - 02-platform
          - 03-argocd
          - all
        default: all
      execution_mode:
        description: "Execution execution track"
        required: true
        type: choice
        options:
          - plan-only
          - apply
        default: plan-only

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  # ==============================================================================
  # LAYER 1: VALIDATE (Runs concurrently for fast PR status checks)
  # ==============================================================================
  validate:
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'plan-only' && inputs.layer == 'all')) && (github.event_name != 'pull_request' || matrix.env == 'dev')
    strategy:
      fail-fast: true
      matrix:
        include:
          # Dev environment layers
          - directory: "infrastructure/terraform/environments/dev/00-bootstrap"
            layer_kind: "bootstrap"
            env: "dev"
          - directory: "infrastructure/terraform/environments/dev/01-infra"
            layer_kind: "infra"
            env: "dev"
          - directory: "infrastructure/terraform/environments/dev/02-platform"
            layer_kind: "platform"
            env: "dev"
          - directory: "infrastructure/terraform/environments/dev/03-argocd"
            layer_kind: "gitops"
            env: "dev"
          # Prod environment layers
          - directory: "infrastructure/terraform/environments/prod/01-infra"
            layer_kind: "infra"
            env: "prod"
          - directory: "infrastructure/terraform/environments/prod/02-platform"
            layer_kind: "platform"
            env: "prod"
          - directory: "infrastructure/terraform/environments/prod/03-argocd"
            layer_kind: "gitops"
            env: "prod"
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: ${{ matrix.directory }}
      layer_kind: ${{ matrix.layer_kind }}
      env: ${{ matrix.env }}
      mode: "validate"
    secrets: inherit

  # ==============================================================================
  # LAYER 2: SEQUENTIAL DEPLOYMENT (Prevents state cross-talk & data race loops)
  # ==============================================================================

  deploy_bootstrap:
    name: "Deploy Dev: Bootstrap Layer (00)"
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'dev' && (inputs.layer == '00-bootstrap' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/00-bootstrap"
      layer_kind: "bootstrap"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_infra:
    name: "Deploy Dev: Infrastructure Layer (01)"
    needs: deploy_bootstrap
    if: (always() && (github.event_name == 'push' && (needs.deploy_bootstrap.result == 'success' || needs.deploy_bootstrap.result == 'skipped'))) || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'dev' && (inputs.layer == '01-infra' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/01-infra"
      layer_kind: "infra"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_platform:
    name: "Deploy Dev: Platform Core Layer (02)"
    needs: deploy_infra
    if: (always() && (github.event_name == 'push' && (needs.deploy_infra.result == 'success' || needs.deploy_infra.result == 'skipped'))) || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'dev' && (inputs.layer == '02-platform' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/02-platform"
      layer_kind: "platform"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_argocd:
    name: "Deploy Dev: GitOps ArgoCD Layer (03)"
    needs: deploy_platform
    if: (always() && (github.event_name == 'push' && (needs.deploy_platform.result == 'success' || needs.deploy_platform.result == 'skipped'))) || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'dev' && (inputs.layer == '03-argocd' || inputs.layer == 'all'))
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/dev/03-argocd"
      layer_kind: "gitops"
      env: "dev"
      mode: "deploy"
    secrets: inherit

  deploy_prod_infra:
    name: "Deploy Prod: Infrastructure Layer (01)"
    needs: deploy_argocd
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'prod' && (inputs.layer == '01-infra' || inputs.layer == 'all')
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/prod/01-infra"
      layer_kind: "infra"
      env: "prod"
      mode: "deploy"
    secrets: inherit

  deploy_prod_platform:
    name: "Deploy Prod: Platform Core Layer (02)"
    needs: deploy_prod_infra
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'prod' && (inputs.layer == '02-platform' || inputs.layer == 'all')
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/prod/02-platform"
      layer_kind: "platform"
      env: "prod"
      mode: "deploy"
    secrets: inherit

  deploy_prod_argocd:
    name: "Deploy Prod: GitOps ArgoCD Layer (03)"
    needs: deploy_prod_platform
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'apply' && inputs.environment == 'prod' && (inputs.layer == '03-argocd' || inputs.layer == 'all')
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      directory: "infrastructure/terraform/environments/prod/03-argocd"
      layer_kind: "gitops"
      env: "prod"
      mode: "deploy"
    secrets: inherit
