apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-monitoring-prod

configMapGenerator:
- envs:
  - prod-public.env
  name: fire-monitoring-config

resources:
- ../../base
- grafana-ops-ingress.yaml
- collaboration-rbac.yaml

images:
- name: api
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/api
  newTag: 884f516
- name: dashboard
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/dashboard
  newTag: 884f516
- name: db-migrations
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/db-migrations
  newTag: 884f516
- name: etl-processor
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/etl-processor
  newTag: 884f516
- name: mcu-simulator
  newName: ghcr.io/fauxx/firemonitoringsystem-v2/mcu-simulator
  newTag: 884f516

labels:
- pairs:
    deployment-type: production
    environment: prod

patches:
- path: cloudflared-patch.yaml
- path: ingress-patch.yaml
- path: api-replicas-patch.yaml
- path: dashboard-replicas-patch.yaml
- patch: |-
    - op: add
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: standard-rwo
  target:
    kind: StatefulSet
    name: influx
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: prometheus-data
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: standard-rwo
  target:
    kind: PersistentVolumeClaim
    name: loki-data
