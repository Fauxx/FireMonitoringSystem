apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - influx/statefulset.yaml
  - influx/service.yaml
  - mqtt/deployment.yaml
  - mqtt/service.yaml
  - mqtt/exporter.yaml
  - telegraf/deployment.yaml
  - flyway/job.yaml
  - flyway/serviceaccount.yaml
  - api/deployment.yaml
  - api/serviceaccount.yaml
  - api/service.yaml
  - etl/deployment.yaml
  - dashboard/deployment.yaml
  - dashboard/service.yaml
  - simulator/deployment.yaml

  - loki/deployment.yaml
  - loki/service.yaml
  - loki/pvc.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - prometheus/pvc.yaml
  - node-exporter/daemonset.yaml
  - node-exporter/service.yaml
  - cadvisor/daemonset.yaml
  - cadvisor/service.yaml
  - alloy/daemonset.yaml
  - ingress
  - cloudflared/configmap.yaml
  - cloudflared/deployment.yaml

configMapGenerator:
  - name: mqtt-config
    files:
      - mosquitto.conf=mqtt/config/mosquitto.conf
  - name: telegraf-config
    files:
      - telegraf.conf=telegraf/telegraf.conf
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.yml
  - name: loki-config
    files:
      - local-config.yaml=loki/local-config.yaml
  - name: alloy-config
    files:
      - config.alloy=alloy/config.alloy