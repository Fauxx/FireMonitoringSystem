version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: fire-db-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-fire_monitoring}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-fire_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10-alpine
    container_name: fire-flyway-local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infrastructure/k8s/base/sql:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fire_monitoring}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
    command: -connectRetries=60 migrate

  influx:
    image: influxdb:2.7-alpine
    container_name: fire-influx-local
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-fire-monitoring}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sensor-data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-local-influx-token}
    ports:
      - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: fire-mqtt-local
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/k8s/base/mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fire-api-local
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      influx:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/usr/src/app/src
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local-password}@db:5432/${POSTGRES_DB:-fire_monitoring}
      INFLUXDB_URL: http://influx:8086
      MQTT_BROKER_HOST: mqtt
      DASHBOARD_DIR: /usr/share/nginx/html

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: fire-dashboard-local
    ports:
      - "8080:80"
    volumes:
      - ./apps/dashboard/public:/usr/share/nginx/html
    depends_on:
      - api

  etl-processor:
    build:
      context: ./apps/etl-processor
      dockerfile: Dockerfile
    container_name: fire-etl-local
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      influx:
        condition: service_healthy
    volumes:
      - ./apps/etl-processor/src:/app/src
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local-password}@db:5432/${POSTGRES_DB:-fire_monitoring}
      INFLUXDB_URL: http://influx:8086
      MQTT_BROKER_HOST: mqtt

volumes:
  db_data:
  influx_data:
  mqtt_data:
